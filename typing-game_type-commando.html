<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Type Commando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0d0a; --fg:#e8e8e8; --muted:#9aa0aa; --btn:#26302a; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:"Press Start 2P", monospace; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; box-sizing:border-box; overflow:hidden; }
  canvas { display:block; image-rendering:pixelated; border:4px solid #000; box-shadow:0 0 0 2px #2a4a2a; cursor:text; }
  .bar { display:flex; gap:12px; align-items:center; font-size:9px; color:var(--muted); flex-wrap:wrap; justify-content:center; line-height:1.6; }
  button { font:inherit; font-size:9px; color:var(--fg); background:var(--btn); border:2px solid #000; padding:8px 10px; cursor:pointer; }
  button:hover { background:#3a4a3e; }
  #kb { position:fixed; left:0; top:0; width:1px; height:1px; opacity:0; font-size:16px; border:0; padding:0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="bar">
  <button id="homeBtn">← TYPING CENTRE</button>
  <button id="musicBtn">MUSIC: ON</button>
  <button id="sfxBtn">SFX: ON</button>
  <button id="pauseBtn">PAUSE</button>
  <span>TYPE TO SHOOT · BACKSPACE = SWITCH TARGET · ESC = PAUSE</span>
</div>
<input id="kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Typing input">

<script>
(() => {
// ---------- constants ----------
const W = 400, H = 225, GROUND = 180, PX = 46;
const FONT = '"Press Start 2P", monospace';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const kb = document.getElementById('kb');
let S = 1;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cssW = Math.max(200, Math.min(innerWidth - 40, (innerHeight - 110) * W / H));
  let s = cssW * dpr / W;
  if (s >= 2) s = Math.floor(s);
  S = s;
  cv.width = Math.round(W * s);
  cv.height = Math.round(H * s);
  cv.style.width = (cv.width / dpr) + 'px';
  cv.style.height = (cv.height / dpr) + 'px';
}
addEventListener('resize', resize);
resize();

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- words ----------
const W1 = `gun run aim fire jump duck dash hit army base camp fort jet tank bomb map flag rope hill rock tree mud vine fog sun storm rain wave zone hero team unit gear boot belt helm road wall gate ammo shot blast quick brave bold calm fast tough sharp alert safe clear move push hold rush scan spy code yard nest`.split(/\s+/);
const W2 = `soldier commando jungle bridge rocket mission target cannon trooper sniper radar signal danger escape battle shield combat helmet canyon valley outpost bunker convoy patrol rescue victory courage marine captain general station tunnel engine machine assault defend advance retreat forward warrior squadron`.split(/\s+/);
const W3 = `explosion artillery battalion fortress infantry commander operation helicopter ammunition grenadier reconnaissance headquarters stronghold underground waterfall destroyer satellite laboratory dangerous invincible champion determined dimension mysterious organism`.split(/\s+/);
const PHR = ['hold the line', 'move move move', 'fire at will', 'take cover', 'lock and load', 'stay sharp', 'mission complete', 'target the core', 'never surrender', 'charge forward'];
const POWERS = { spread: { label: 'S', name: 'SPREAD GUN', color: '#ff5050' }, rapid: { label: 'R', name: 'RAPID FIRE', color: '#50a0ff' }, shield: { label: 'B', name: 'BARRIER', color: '#ffd040' }, medal: { label: '1UP', name: 'EXTRA LIFE', color: '#40e060' } };

const STAGES = [
  { name: 'JUNGLE', words: W1, boss: 'wall', bossName: 'DEFENSE WALL', bossHp: 110, bossWords: W2,
    gap: [2.4, 3.6], quota: 14, bulletSpd: 42, runSpd: [20, 30], fire: [3.5, 5.5], mix: { runner: 4, rifle: 3, turret: 1, drone: 1 } },
  { name: 'ENEMY BASE', words: W1.concat(W2), boss: 'tank', bossName: 'WAR TANK', bossHp: 150, bossWords: W2.concat(W3),
    gap: [2.0, 3.1], quota: 18, bulletSpd: 50, runSpd: [24, 36], fire: [3.0, 4.6], mix: { runner: 3, rifle: 3, turret: 2, drone: 2 } },
  { name: 'ALIEN HIVE', words: W2.concat(W3), boss: 'heart', bossName: 'ALIEN HEART', bossHp: 190, bossWords: W3.concat(PHR),
    gap: [1.8, 2.7], quota: 22, bulletSpd: 56, runSpd: [28, 42], fire: [2.6, 4.0], mix: { runner: 4, rifle: 2, turret: 2, drone: 3 } },
];

// ---------- audio ----------
let ac = null, musicGain = null, noiseBuf = null, musicOn = true, sfxOn = true;
function ensureAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      musicGain = ac.createGain();
      musicGain.gain.value = musicOn ? 1 : 0;
      musicGain.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      startMusic();
    } catch (e) {}
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
const mtof = m => 440 * 2 ** ((m - 69) / 12);
function playNote(dest, f0, f1, t, dur, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(dest);
  o.start(t); o.stop(t + dur + .02);
}
function playNoise(dest, t, dur, vol, freq, ftype) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(dest);
  s.start(t, Math.random() * .5); s.stop(t + dur + .02);
}
function tone(f0, f1, dur, type = 'square', vol = .06, delay = 0) {
  if (!ac || !sfxOn) return;
  playNote(ac.destination, f0, f1, ac.currentTime + delay, dur, type, vol);
}
function noise(dur, vol, freq, ftype = 'lowpass', delay = 0) {
  if (!ac || !sfxOn) return;
  playNoise(ac.destination, ac.currentTime + delay, dur, vol, freq, ftype);
}
const SFX = {
  key: () => tone(1500, 0, .02, 'square', .015),
  wrong: () => tone(120, 80, .12, 'sawtooth', .06),
  shoot: () => { tone(900, 200, .08, 'square', .05); noise(.06, .15, 3000, 'highpass'); },
  boom: big => { noise(big ? .5 : .25, big ? .5 : .3, big ? 500 : 900); tone(big ? 120 : 200, 40, big ? .4 : .18, 'square', .08); },
  power: () => [0, 4, 7, 12].forEach((m, i) => tone(mtof(72 + m), 0, .08, 'square', .05, i * .06)),
  die: () => { tone(600, 60, .7, 'square', .08); noise(.5, .3, 700); },
  alarm: () => { for (let i = 0; i < 3; i++) { tone(880, 0, .12, 'square', .05, i * .3); tone(660, 0, .12, 'square', .05, i * .3 + .15); } },
  clear: () => [0, 4, 7, 12, 7, 12, 16].forEach((m, i) => tone(mtof(67 + m), 0, .12, 'square', .05, i * .1)),
  select: () => tone(660, 990, .08, 'square', .05),
};

// driving run-and-gun loop
const BASS = [40, 40, 52, 40, 43, 40, 50, 40, 38, 38, 50, 38, 43, 45, 47, 50];
const LEAD = [64, 0, 67, 69, 0, 67, 64, 0, 62, 0, 64, 67, 0, 64, 62, 59];
const music = { step: 0, next: 0, timer: null };
function startMusic() {
  if (music.timer || !ac) return;
  music.next = ac.currentTime + .1; music.step = 0;
  music.timer = setInterval(scheduleMusic, 25);
}
function scheduleMusic() {
  const spb = 60 / 150 / 2;
  while (music.next < ac.currentTime + .12) {
    const t = music.next, s = music.step % 16;
    playNote(musicGain, mtof(BASS[s]), 0, t, spb * .8, 'triangle', .08);
    if (s % 4 === 0) playNote(musicGain, 140, 40, t, .15, 'sine', .22);
    if (s % 4 === 2) playNoise(musicGain, t, .1, .1, 1800, 'bandpass');
    if (s % 2 === 1) playNoise(musicGain, t, .04, .04, 7000, 'highpass');
    if (music.step % 64 >= 32 && LEAD[s]) playNote(musicGain, mtof(LEAD[s]), 0, t, spb * .9, 'square', .022);
    music.next += spb; music.step++;
  }
}

// ---------- state ----------
let state = 'title', stateT = 0, paused = false, clock = 0;
let stageI = 0, cfg = STAGES[0];
let targets = [], shots = [], parts = [], booms = [], pops = [];
let lock = null, scroll = 0, scrollSpd = 18;
let spawnT = 0, spawned = 0, bossPhase = false, boss = null;
let lives = 3, score = 0, weapon = 'normal', shieldT = 0, invT = 0, dead = false, deathT = 0;
let streak = 0, banner = null, shake = 0, flashT = 0, errFlash = 0, lastSpeed = 0;
let stats, stageStats, konami = [], extraLives = false;
let best = 0;
try { best = +localStorage.getItem('typeCommandoBest') || 0; } catch (e) {}

function freshStats() { return { correct: 0, wrong: 0, time: 0, kills: 0, maxStreak: 0, deaths: 0 }; }
function showBanner(text, color = '#ffd040', size = 16, sub = '', life = 2) { banner = { text, color, size, sub, t: 0, life }; }
function popup(text, x, y, color = '#fff', size = 7) { pops.push({ text, x, y, t: 0, color, size }); }
function explode(x, y, big) {
  booms.push({ x, y, t: 0, r: big ? 22 : 11 });
  for (let i = 0; i < (big ? 30 : 14); i++) {
    const a = rnd(0, Math.PI * 2), v = rnd(30, big ? 160 : 100);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, t: 0, life: rnd(.3, .7), color: pick(['#fff', '#ffd040', '#ff8020', '#ff4010']), g: 180 });
  }
  SFX.boom(big);
}

// ---------- word selection ----------
function usedFirsts() {
  const s = new Set();
  for (const t of targets) if (!t.doomed) s.add(t.word[0]);
  return s;
}
function pickWord(pool) {
  const used = usedFirsts();
  const free = pool.filter(w => !used.has(w[0]));
  return pick(free.length ? free : pool);
}
function pickLetter() {
  const used = usedFirsts();
  const rest = lock ? lock.word.slice(lock.pos) : '';
  const all = 'abcdefghijklmnopqrstuvwxyz'.split('');
  let free = all.filter(c => !used.has(c) && !rest.includes(c));
  if (!free.length) free = all.filter(c => !used.has(c));
  return pick(free.length ? free : all);
}

// ---------- spawning ----------
function addTarget(o) {
  const t = Object.assign({ pos: 0, err: 0, t: 0, doomed: false, dead: false, vx: 0, vy: 0 }, o);
  targets.push(t);
  return t;
}
function spawnEnemy() {
  const m = cfg.mix, total = m.runner + m.rifle + m.turret + m.drone;
  let r = Math.random() * total, kind;
  for (const k of ['runner', 'rifle', 'turret', 'drone']) { r -= m[k]; if (r < 0) { kind = k; break; } }
  kind = kind || 'runner';
  const base = { kind, x: W + 14, y: GROUND, fireT: rnd(...cfg.fire) * .6 };
  if (kind === 'runner') Object.assign(base, { word: pickWord(cfg.words.filter(w => w.length <= 6)), spd: rnd(...cfg.runSpd) });
  if (kind === 'rifle') Object.assign(base, { word: pickWord(cfg.words), spd: 40, stopX: rnd(220, 330) });
  if (kind === 'turret') Object.assign(base, { word: pickWord(cfg.words.filter(w => w.length >= 5).concat(W2)) });
  if (kind === 'drone') Object.assign(base, { word: pickWord(cfg.words), y: rnd(40, 80), hoverX: rnd(220, 330), spd: 50, phase: rnd(0, 6) });
  addTarget(base);
  spawned++;
  if (spawned % 6 === 3) spawnCapsule();
}
function spawnCapsule() {
  const opts = ['spread', 'rapid', 'shield', 'spread', 'rapid'];
  if (lives < 3) opts.push('medal', 'medal');
  const p = pick(opts);
  addTarget({ kind: 'capsule', power: p, word: p, x: W + 10, y: rnd(32, 60), spd: 32, phase: rnd(0, 6) });
}
function fireAt(x, y, kind = 'bullet') {
  const tx = PX + 2, ty = GROUND - 16;
  const d = Math.hypot(tx - x, ty - y), sp = cfg.bulletSpd * (kind === 'bomb' ? .85 : 1);
  addTarget({ kind, word: pickLetter(), x, y, vx: (tx - x) / d * sp, vy: (ty - y) / d * sp });
}
function startBoss() {
  bossPhase = true;
  showBanner('WARNING!', '#ff3030', 18, cfg.bossName + ' APPROACHING', 2.4);
  SFX.alarm();
  const b = { kind: 'boss', type: cfg.boss, word: pickWord(cfg.bossWords), hp: cfg.bossHp, maxHp: cfg.bossHp, x: W + 90, homeX: 0, y: 0, fireT: 3, spawnT: 6 };
  if (b.type === 'wall') { b.homeX = 330; b.cy = 112; }
  if (b.type === 'tank') { b.homeX = 320; b.cy = 128; }
  if (b.type === 'heart') { b.homeX = 330; b.cy = 104; }
  b.y = b.cy;
  boss = addTarget(b);
}

// ---------- flow ----------
function newGame() {
  stageI = 0; score = 0; stats = freshStats();
  lives = extraLives ? 30 : 3;
  weapon = 'normal';
  startStage();
}
function startStage() {
  cfg = STAGES[stageI];
  targets = []; shots = []; parts = []; booms = []; pops = [];
  lock = null; scroll = 0; spawnT = 3; spawned = 0; bossPhase = false; boss = null;
  shieldT = 0; invT = 0; dead = false; streak = 0;
  stageStats = freshStats();
  state = 'intro'; stateT = 0;
  showBanner(`STAGE ${stageI + 1}`, '#ffd040', 18, cfg.name, 2.4);
}
function stageClear() {
  state = 'clear'; stateT = 0;
  const bonus = stageStats.deaths === 0 ? 5000 : 0;
  score += 3000 + bonus;
  stageStats.bonus = bonus;
  saveBest();
  SFX.clear();
}
function gameOver() { state = 'gameover'; stateT = 0; saveBest(); }
function saveBest() {
  if (score > best) { best = score; try { localStorage.setItem('typeCommandoBest', best); } catch (e) {} }
}

// ---------- typing ----------
function addCorrect() { stats.correct++; stageStats.correct++; }
function addWrong() { stats.wrong++; stageStats.wrong++; }
function handleChar(ch) {
  if (paused || state !== 'play' || dead) return;
  ch = ch.toLowerCase();
  if (lock && (lock.dead || lock.doomed)) lock = null;
  if (lock && lock.word[lock.pos] !== ch) {
    // an incoming bullet/bomb letter interrupts the current word without breaking it
    const b = targets.find(t => (t.kind === 'bullet' || t.kind === 'bomb') && !t.doomed && t.word === ch);
    if (b) { addCorrect(); SFX.key(); b.t0 = clock; fire(b); return; }
  }
  if (!lock) {
    const c = targets.filter(t => !t.doomed && t.word[0] === ch && t.x < W - 4);
    if (!c.length) return miss();
    c.sort((a, b) => danger(b) - danger(a));
    lock = c[0]; lock.pos = 0; lock.err = 0; lock.t0 = clock;
  }
  if (lock.word[lock.pos] === ch) {
    lock.pos++; addCorrect(); SFX.key();
    if (lock.pos >= lock.word.length) { const t = lock; lock = null; fire(t); }
  } else {
    lock.err++;
    miss();
  }
}
function danger(t) {
  if (t.kind === 'bullet' || t.kind === 'bomb') return 1000 - Math.hypot(t.x - PX, t.y - GROUND);
  if (t.kind === 'runner') return 600 - t.x;
  return 300 - t.x;
}
function miss() {
  addWrong();
  if (streak >= 5) popup('STREAK LOST', PX + 10, GROUND - 46, '#ff6060', 6);
  streak = 0; errFlash = .2;
  SFX.wrong();
}
function releaseLock() { if (lock) { lock.pos = 0; lock = null; } }

function fire(t) {
  const n = t.word.length;
  const dt = Math.max(.05, clock - (t.t0 || clock));
  const wpm = n > 1 ? (n - 1) / dt * 12 : 60;
  const sm = n > 1 ? clamp(wpm / 40, .5, 3) : 1;
  if (n > 1) lastSpeed = sm;
  if (t.err === 0) { streak++; stats.maxStreak = Math.max(stats.maxStreak, streak); stageStats.maxStreak = Math.max(stageStats.maxStreak, streak); }
  const gx = PX + 14, gy = GROUND - 20;
  const tx = t.x, ty = t.kind === 'boss' ? t.cy : t.kind === 'bullet' || t.kind === 'bomb' || t.kind === 'drone' || t.kind === 'capsule' ? t.y : t.y - 12;
  const dur = clamp(Math.hypot(tx - gx, ty - gy) / 700, .04, .4);
  const spread = weapon === 'spread';
  shots.push({ x: gx, y: gy, fx: gx, fy: gy, tx, ty, t: 0, dur, target: t, sm, clean: t.err === 0, spread });
  if (spread) for (const a of [-1, 1]) shots.push({ x: gx, y: gy, fx: gx, fy: gy, tx: tx + 4, ty: ty + a * 14, t: 0, dur, target: null });
  SFX.shoot();
  if (t.kind === 'boss') { t.word = pickWord(cfg.bossWords.filter(w => w !== t.word)); t.pos = 0; t.err = 0; }
  else { t.doomed = true; t.vx *= .2; t.vy *= .2; }
}
function shotLands(s) {
  const t = s.target;
  if (!t || t.dead) return;
  if (t.kind === 'boss') {
    if (state !== 'play' || !boss) return;
    const dmg = Math.round((5 + t.word.length * .4 + 4) * clamp(s.sm, .6, 2.2) * (weapon === 'rapid' ? 1.6 : 1) * (s.clean ? 1.15 : 1));
    boss.hp = Math.max(0, boss.hp - dmg);
    boss.flash = .12;
    popup(`-${dmg}`, s.tx, s.ty - 10, '#fff', 8);
    explode(s.tx + rnd(-6, 6), s.ty + rnd(-6, 6), false);
    score += dmg * 20;
    if (boss.hp <= 0) bossDown();
    return;
  }
  t.dead = true;
  const small = t.kind === 'bullet' || t.kind === 'bomb';
  explode(t.x, small ? t.y : t.y - 10, t.kind === 'turret' || t.kind === 'drone');
  if (t.kind === 'capsule') return powerUp(t.power);
  const base = small ? 50 : 100 + t.word.length * 20;
  const mult = s.sm * (1 + Math.min(streak, 20) * .05) * (weapon === 'rapid' ? 1.5 : 1);
  const pts = Math.round(base * mult / 10) * 10;
  score += pts;
  if (!small) {
    stats.kills++; stageStats.kills++;
    const tag = s.sm >= 2 ? ' BLAZING!' : s.sm >= 1.5 ? ' FAST!' : '';
    popup(`+${pts}${tag}`, t.x, t.y - 34, s.sm >= 1.5 ? '#ffd040' : '#fff', 6);
  }
  if (s.spread) {
    for (const b of targets) if ((b.kind === 'bullet' || b.kind === 'bomb') && !b.doomed && !b.dead) { b.dead = true; explode(b.x, b.y, false); score += 50; }
  }
}
function powerUp(p) {
  SFX.power();
  const P = POWERS[p];
  if (p === 'medal') { lives++; }
  else if (p === 'shield') shieldT = 10;
  else weapon = p;
  popup(P.name + '!', PX + 20, GROUND - 56, P.color, 7);
  score += 500;
}
function bossDown() {
  const b = boss;
  b.doomed = true; lock = null;
  for (const t of targets) if (t !== b && !t.dead) { t.dead = true; explode(t.x, t.y - 6, false); }
  for (let i = 0; i < 10; i++) setTimeout(() => explode(b.x + rnd(-40, 40), b.cy + rnd(-50, 50), true), i * 140);
  shake = 10; flashT = .4;
  score += 10000;
  showBanner('DESTROYED!', '#ffd040', 18, '+10000', 2);
  state = 'bossdown'; stateT = 0;
}
function playerHit() {
  if (dead || invT > 0 || state !== 'play') return;
  if (shieldT > 0) return;
  lives--; dead = true; deathT = 0;
  stats.deaths++; stageStats.deaths++;
  weapon = 'normal'; streak = 0; lock = null;
  for (const t of targets) if ((t.kind === 'bullet' || t.kind === 'bomb') && !t.dead) { t.dead = true; explode(t.x, t.y, false); }
  shake = 6; flashT = .3;
  SFX.die();
  popup('OUCH!', PX, GROUND - 46, '#ff5050', 8);
}

// ---------- update ----------
function update(dt) {
  clock += dt; stateT += dt;
  if (state === 'intro') {
    scroll += scrollSpd * dt;
    if (stateT > 2.4) state = 'play';
  } else if (state === 'play') updatePlay(dt);
  else if (state === 'bossdown') {
    if (stateT > 2.6) stageClear();
  }
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.t += dt;
    const k = Math.min(1, s.t / s.dur);
    s.x = s.fx + (s.tx - s.fx) * k; s.y = s.fy + (s.ty - s.fy) * k;
    if (k >= 1) { shots.splice(i, 1); shotLands(s); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t >= p.life) parts.splice(i, 1);
  }
  for (let i = booms.length - 1; i >= 0; i--) { booms[i].t += dt; if (booms[i].t > .35) booms.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 1.1) pops.splice(i, 1); }
  if (banner) { banner.t += dt; if (banner.t > banner.life) banner = null; }
  shake = Math.max(0, shake - dt * 25);
  flashT = Math.max(0, flashT - dt);
  errFlash = Math.max(0, errFlash - dt);
}
function updatePlay(dt) {
  stats.time += dt; stageStats.time += dt;
  if (shieldT > 0) shieldT -= dt;
  if (invT > 0) invT -= dt;
  if (dead) {
    deathT += dt;
    if (deathT > 1.4) {
      if (lives <= 0) return gameOver();
      dead = false; invT = 2.5;
    }
  }
  const moving = !bossPhase;
  const ws = moving ? scrollSpd : 0;
  scroll += ws * dt;

  if (!bossPhase) {
    spawnT -= dt;
    const alive = targets.some(t => !t.dead && ['runner', 'rifle', 'turret', 'drone'].includes(t.kind));

        if (t.x < PX + 14) { t.dead = true; explode(t.x, t.y - 10, false); if (lock === t) lock = null; playerHit(); }
        break;
      case 'turret':
        t.x -= ws * dt;
        t.fireT -= dt;

function accuracy(s = stats) { return s && s.correct + s.wrong ? Math.round(100 * s.correct / (s.correct + s.wrong)) : 100; }
function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, 13);
  ctx.fillStyle = errFlash > 0 ? '#ff2020' : 'transparent'; ctx.fillRect(0, 12, W, 1);
  const shown = Math.min(lives, 8);
  for (let i = 0; i < shown; i++) { R(6 + i * 9, 2, 6, 3, '#e02020'); R(7 + i * 9, 5, 4, 5, '#ffd040'); }
  if (lives > 8) txt(`x${lives}`, 6 + 8 * 9, 3, '#ffd040', 'left', 6);
  txt(`1P ${score}`, 120, 3, '#fff', 'left', 6);
  txt(`STAGE ${stageI + 1} ${cfg.name}`, 394, 3, '#9aa0aa', 'right', 6);
  // bottom strip
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, H - 12, W, 12);
  txt(`${overallWpm()} WPM`, 6, H - 10, '#ffd040', 'left', 6);
  txt(`${accuracy()}%`, 76, H - 10, '#9aa0aa', 'left', 6);
  txt(streak >= 2 ? `STREAK ${streak}` : '', 124, H - 10, '#60d0ff', 'left', 6);
  const wp = weapon === 'normal' ? 'RIFLE' : POWERS[weapon].name;
  txt(wp, 250, H - 10, weapon === 'normal' ? '#9aa0aa' : POWERS[weapon].color, 'center', 6);
  if (shieldT > 0) txt('BARRIER', 250, H - 20, '#ffd040', 'center', 5);
  if (!bossPhase) {
    const k = Math.min(1, spawned / cfg.quota);
    R(300, H - 9, 90, 5, '#222'); R(300, H - 9, Math.round(90 * k), 5, '#40c060');
    txt('BOSS', 392, H - 20, '#6a7070', 'right', 5);
  } else if (boss) {
    R(120, 16, 160, 6, '#300'); R(120, 16, Math.round(160 * boss.hp / boss.maxHp), 6, '#ff3030');
    txt(cfg.bossName, 200, 24, '#ff6060', 'center', 5);
  }
}
function drawBanner() {
  if (!banner) return;
  const b = banner, s = b.t < .15 ? 2 - b.t / .15 : 1;
  ctx.save(); ctx.translate(200, 82); ctx.scale(s, s);
  ctx.globalAlpha = clamp((b.life - b.t) * 4, 0, 1);
  txt(b.text, 0, -b.size / 2, b.color, 'center', b.size);
  if (b.sub) txt(b.sub, 0, b.size / 2 + 8, '#fff', 'center', 7);
  ctx.restore(); ctx.globalAlpha = 1;
}
function overlay(a = .6) { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, W, H); }
function blinkPrompt(s, y) { if (Math.sin(clock * 6) > -.2) txt(s, 200, y, '#fff', 'center', 8); }
function grade(s) {
  const g = overallWpm(s) * (accuracy(s) / 100) ** 2;
  return g >= 60 ? 'S' : g >= 45 ? 'A' : g >= 30 ? 'B' : g >= 18 ? 'C' : 'D';
}
function statRows(s, y) {
  const rows = [['SPEED', `${overallWpm(s)} WPM`], ['ACCURACY', `${accuracy(s)}%`], ['KILLS', String(s.kills)], ['BEST STREAK', String(s.maxStreak)], ['SCORE', String(score)]];
  rows.forEach(([k, v], i) => { txt(k, 110, y + i * 12, '#9aa0aa', 'left', 7); txt(v, 290, y + i * 12, '#fff', 'right', 7); });
  txt(`RANK ${grade(s)}`, 200, y + rows.length * 12 + 6, '#ffd040', 'center', 12);
}

function drawScene() {
  ctx.save();
  if (shake) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  drawWorld();
  if (boss && !boss.dead && (state !== 'bossdown' || stateT < 1.6)) drawBoss(boss);
  for (const t of targets) {
    if (t.dead || (t.doomed && t.kind !== 'boss')) continue;
    if (t.kind === 'runner' || t.kind === 'rifle') drawSoldier(t);
    else if (t.kind === 'turret') drawTurret(t);
    else if (t.kind === 'drone') drawDrone(t);
    else if (t.kind === 'capsule') drawCapsule(t);
  }
  drawPlayer();
  for (const t of targets) if (!t.dead && !t.doomed && (t.kind === 'bullet' || t.kind === 'bomb')) drawBullet(t);
  drawEffects();
  if (state === 'play') for (const t of targets) if (!t.dead) drawLabel(t);
  if (lock && !lock.dead && state === 'play') drawLabel(lock);
  ctx.restore();
  drawHUD();
  drawBanner();
  if (flashT > 0) { ctx.globalAlpha = flashT; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
function draw() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  if (state === 'title') {
    scroll += .3;
    drawWorld();
    ctx.save(); ctx.translate(PX + 40, GROUND); ctx.scale(2, 2); drawCommandoBody(false, Math.floor(clock * 8) % 2); ctx.restore();
    overlay(.35);
    txt('TYPE', 200, 20, '#ffd040', 'center', 20);
    txt('COMMANDO', 200, 44, '#ff3030', 'center', 22);
    ['TYPE A WORD TO SHOOT THAT ENEMY', 'RED BALL = BULLET: TYPE ITS LETTER', 'FASTER TYPING = MORE POINTS', 'SHOOT CAPSULES FOR POWER-UPS', 'BACKSPACE = SWITCH TARGET'].forEach((s, i) => txt(s, 200, 82 + i * 11, '#e8e8e8', 'center', 6));
    blinkPrompt('PRESS ENTER', 148);
    if (extraLives) txt('30 LIVES!', 200, 162, '#40e060', 'center', 7);
    else if (best) txt(`BEST ${best}`, 200, 162, '#9aa0aa', 'center', 6);
    return;
  }
  drawScene();
  if (state === 'clear') {
    overlay(.7);
    txt(`STAGE ${stageI + 1} CLEAR!`, 200, 18, '#ffd040', 'center', 14);
    statRows(stageStats, 46);
    txt(stageStats.bonus ? 'NO-DEATH BONUS +5000' : 'CLEAR BONUS +3000', 200, 140, '#40e060', 'center', 6);
    blinkPrompt(stageI + 1 < STAGES.length ? 'ENTER = NEXT STAGE' : 'ENTER = FINISH', 196);
  } else if (state === 'win') {
    overlay(.7);
    txt('MISSION', 200, 14, '#ffd040', 'center', 16);
    txt('COMPLETE!', 200, 32, '#40e060', 'center', 16);
    statRows(stats, 60);
    if (score >= best) txt('NEW BEST!', 200, 158, '#40e060', 'center', 7);
    blinkPrompt('PRESS ENTER', 196);
  } else if (state === 'gameover') {
    overlay(.75);
    txt('GAME OVER', 200, 22, '#ff3030', 'center', 18);
    statRows(stats, 54);
    blinkPrompt('ENTER = CONTINUE STAGE', 186);
    txt('ESC = TITLE', 200, 202, '#9aa0aa', 'center', 6);
  }
  if (paused) {
    overlay(.6);
    txt('PAUSED', 200, 90, '#ffd040', 'center', 16);
    txt('ESC TO RESUME', 200, 116, '#fff', 'center', 7);
  }
}

// ---------- input ----------
const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
function onEnter() {
  if (paused) return;
  if (state === 'title') { SFX.select(); newGame(); }
  else if (state === 'clear') {
    if (stageI + 1 < STAGES.length) { stageI++; startStage(); }
    else { state = 'win'; stateT = 0; saveBest(); }
  } else if (state === 'win') state = 'title';
  else if (state === 'gameover') { lives = extraLives ? 30 : 3; score = 0; weapon = 'normal'; startStage(); }
}
function togglePause() {
  if (!['intro', 'play', 'bossdown'].includes(state)) return;
  paused = !paused;
  pauseBtn.textContent = paused ? 'RESUME' : 'PAUSE';
  if (musicGain) musicGain.gain.value = musicOn && !paused ? 1 : 0;
}
kb.addEventListener('input', () => {
  const v = kb.value; kb.value = '';
  ensureAudio();
  for (const ch of v) handleChar(ch);
});
addEventListener('keydown', e => {
  ensureAudio();
  if (state === 'title') {
    konami.push(e.key); konami = konami.slice(-10);
    if (KONAMI.every((k, i) => konami[i] === k) && !extraLives) { extraLives = true; SFX.power(); }
  }
  if (e.key === 'Escape') { if (state === 'gameover' || state === 'win') state = 'title'; else togglePause(); e.preventDefault(); return; }
  if (e.key === 'Enter') { onEnter(); e.preventDefault(); return; }
  if (e.key === 'Backspace') { releaseLock(); e.preventDefault(); return; }
  if (e.key === 'Tab' || e.key.startsWith('Arrow')) { e.preventDefault(); return; }
  if (e.key.length === 1 && !e.metaKey && !e.ctrlKey && document.activeElement !== kb) {
    handleChar(e.key);
    e.preventDefault();
    kb.focus({ preventScroll: true });
  }
});
cv.addEventListener('pointerdown', () => {
  ensureAudio();
  kb.focus({ preventScroll: true });
  if (!['play', 'intro', 'bossdown'].includes(state)) onEnter();
});

document.getElementById('homeBtn').addEventListener('click', () => {
  window.location.href = 'https://reubenask.github.io/emerald-hills/platform.html';
});
const musicBtn = document.getElementById('musicBtn');
const sfxBtn = document.getElementById('sfxBtn');
const pauseBtn = document.getElementById('pauseBtn');
musicBtn.addEventListener('click', () => {
  ensureAudio();
  musicOn = !musicOn; musicBtn.textContent = 'MUSIC: ' + (musicOn ? 'ON' : 'OFF');
  if (musicGain) musicGain.gain.value = musicOn && !paused ? 1 : 0;
  kb.focus({ preventScroll: true });
});
sfxBtn.addEventListener('click', () => {
  sfxOn = !sfxOn; sfxBtn.textContent = 'SFX: ' + (sfxOn ? 'ON' : 'OFF');
  kb.focus({ preventScroll: true });
});
pauseBtn.addEventListener('click', () => { togglePause(); kb.focus({ preventScroll: true }); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !paused && ['intro', 'play', 'bossdown'].includes(state)) togglePause();
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
const fontReady = document.fonts ? document.fonts.load(`8px ${FONT}`).catch(() => {}) : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(() => {
  kb.focus({ preventScroll: true });
  requestAnimationFrame(frame);
});
})();
</script>
