<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Type Commando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --gold:#ffd23f; --red:#ff3b3b; --green:#3ee06a; --blue:#5aa8ff; --panel:rgba(8,14,10,.84); }
  html, body { margin:0; height:100%; background:#050806; color:#eee; font-family:"Russo One", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:12px; box-sizing:border-box; overflow:hidden; }
  #wrap { position:relative; overflow:hidden; border-radius:10px; box-shadow:0 0 0 2px #1d3a22, 0 10px 40px rgba(0,0,0,.6); background:#000; cursor:text; user-select:none; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #ui { position:absolute; inset:0; pointer-events:none; }
  .hidden { display:none !important; }
  .stroke { text-shadow: 0 .08em 0 #000, 0 0 .4em rgba(0,0,0,.8); }

  #top { position:absolute; top:2%; left:2%; right:2%; display:flex; justify-content:space-between; align-items:flex-start; }
  #lives { display:flex; gap:.35em; align-items:center; }
  .medal { width:.9em; height:1.4em; position:relative; }
  .medal::before { content:''; position:absolute; left:.15em; right:.15em; top:0; height:.55em; background:linear-gradient(90deg,#d22,#f44 50%,#d22); }
  .medal::after { content:''; position:absolute; left:0; right:0; bottom:0; height:.9em; border-radius:50%; background:radial-gradient(circle at 35% 35%,#fff6b0,var(--gold) 55%,#a77a00); border:.08em solid #000; }
  #livesX { font-size:.9em; color:var(--gold); margin-left:.2em; }
  #score { font-size:1.3em; margin-top:.2em; }
  #stageName { text-align:right; font-size:1em; color:#cfe8d0; }
  #weapon { text-align:right; font-size:.8em; margin-top:.3em; }
  #bossBar { position:absolute; top:3%; left:50%; transform:translateX(-50%); width:34%; text-align:center; }
  #bossBar .bb { height:.9em; background:#2a0606; border:.12em solid #000; outline:.1em solid #ff6060; border-radius:.3em; overflow:hidden; }
  #bossBar .bb b { display:block; height:100%; background:linear-gradient(#ff9a9a,#ff3030 55%,#a00); width:100%; transition:width .2s; }
  #bossBar span { font-size:.75em; color:#ff8a8a; letter-spacing:.1em; }

  #bottom { position:absolute; left:2%; right:2%; bottom:2.5%; display:flex; justify-content:space-between; align-items:center; font-family:"JetBrains Mono", monospace; font-size:.85em; }
  #bottom .grp { background:rgba(0,0,0,.55); border-radius:.4em; padding:.35em .8em; display:flex; gap:1.2em; }
  #wpm { color:var(--gold); } #acc { color:#cfd; } #streak { color:#7fd6ff; }
  #prog { display:flex; align-items:center; gap:.6em; font-family:"Russo One"; font-size:.85em; color:#9ab; }
  #prog i { width:8em; height:.55em; border-radius:.3em; background:#1a2a1e; overflow:hidden; display:block; }
  #prog i b { display:block; height:100%; background:linear-gradient(90deg,#2fbf48,#b8ff7a); width:0; }

  #labels { position:absolute; inset:0; overflow:hidden; }
  .lbl { position:absolute; transform:translate(-50%,-100%); background:rgba(6,10,8,.82); border:.12em solid #7a8a80; border-radius:.4em; padding:.15em .5em; font-family:"JetBrains Mono", monospace; font-weight:800; font-size:1.25em; color:#fff; white-space:pre; box-shadow:0 .2em .6em rgba(0,0,0,.5); }
  .lbl .d { color:var(--green); }
  .lbl.lock { border-color:var(--gold); background:rgba(30,24,4,.92); transform:translate(-50%,-100%) scale(1.15); z-index:5; box-shadow:0 0 1em rgba(255,210,63,.6); }
  .lbl.lock::after { content:''; position:absolute; left:50%; bottom:-.55em; margin-left:-.35em; border:.35em solid transparent; border-top-color:var(--gold); }
  .lbl.cap { border-color:var(--c); color:var(--c); }
  .lbl.boss { font-size:1.6em; border-color:#ff5050; }
  .bl { position:absolute; transform:translate(-50%,-50%); width:1.7em; height:1.7em; border-radius:50%; background:#fff; color:#111; border:.18em solid #ff2a2a; display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono", monospace; font-weight:800; font-size:1.05em; box-shadow:0 0 .8em rgba(255,40,40,.8); }
  .bl.bomb { border-color:#ff40ff; box-shadow:0 0 .8em rgba(255,64,255,.8); }
  .pp { position:absolute; transform:translate(-50%,-50%); font-size:1.2em; white-space:nowrap; animation:float 1.1s ease-out forwards; }
  .pp.sm { font-size:.9em; }

  #banner { position:absolute; left:0; right:0; top:30%; text-align:center; }
  #banner .t { font-size:4.6em; line-height:1; background:linear-gradient(#fff7c2,#ffd23f 45%,#c97a00); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 .06em 0 #000) drop-shadow(0 0 .3em rgba(0,0,0,.9)); }
  #banner.red .t { background:linear-gradient(#ffd0d0,#ff3b3b 45%,#8a0000); -webkit-background-clip:text; background-clip:text; }
  #banner .s { font-size:1.2em; margin-top:.4em; }
  #banner.pop { animation:pop .35s cubic-bezier(.2,1.6,.4,1); }
  #flash { position:absolute; inset:0; opacity:0; background:#fff; }
  #errbar { position:absolute; left:0; right:0; bottom:0; height:.35em; background:var(--red); opacity:0; }

  #screen { position:absolute; inset:0; }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .logo1 { font-size:4em; color:var(--gold); line-height:1; }
  .logo2 { font-size:5.6em; line-height:.95; background:linear-gradient(#c8ffc8,#3ee06a 45%,#0a6a2a); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 .05em 0 #000); }
  .howto { margin-top:1.1em; font-size:.95em; line-height:1.85; background:rgba(0,0,0,.5); padding:.6em 1.4em; border-radius:.5em; }
  .howto b { color:var(--gold); font-weight:400; }
  .howto .bl { position:static; transform:none; display:inline-flex; width:1.4em; height:1.4em; font-size:.85em; vertical-align:middle; }
  .prompt { margin-top:1.1em; font-size:1.3em; animation:blink 1s steps(2) infinite; }
  .muted { color:#9ab0a0; font-size:.8em; margin-top:.6em; }
  .big { font-size:3.6em; }
  .stats { background:var(--panel); border-radius:.6em; padding:1em 2em; margin-top:1em; min-width:22em; }
  .stats div { display:flex; justify-content:space-between; margin:.35em 0; color:#aab; }
  .stats div b { color:#fff; font-weight:400; font-family:"JetBrains Mono", monospace; }

  @keyframes blink { 50% { opacity:.35; } }
  @keyframes pop { from { transform:scale(2.2); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes float { 0% { opacity:0; margin-top:.5em; } 15% { opacity:1; } 100% { opacity:0; margin-top:-2.2em; } }

  .btns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; font-size:12px; color:#84948a; }
  button { font:inherit; font-size:12px; color:#eee; background:#1c2a20; border:1px solid #000; border-radius:6px; padding:8px 12px; cursor:pointer; }
  button:hover { background:#2a4030; }
  #kb { position:fixed; left:0; top:0; width:1px; height:1px; opacity:0; font-size:16px; border:0; padding:0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="ui">
    <div id="labels"></div>
    <div id="top" class="hidden">
      <div><div id="lives"></div><div id="score" class="stroke"></div></div>

    </div>

    <div id="bottom" class="hidden">

</div>
<div class="btns">
  <button id="homeBtn">← TYPING CENTRE</button>
  <button id="musicBtn">MUSIC: ON</button>
  <button id="sfxBtn">SFX: ON</button>

</div>
<input id="kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Typing input">

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

// Game logic runs in a 400x225 "arena" coordinate space (y down, ground at 180);
// the 3D scene maps it with WX/WY so the tested gameplay numbers stay the same.
const W = 400, H = 225, GROUND = 180, PX = 46;
const WX = x => (x - 200) / 20, WY = y => (GROUND - y) / 20;
const $ = id => document.getElementById(id);
const wrap = $('wrap'), kb = $('kb'), screenEl = $('screen'), labelsEl = $('labels');
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const setText = (el, s) => { if (el._t !== s) { el._t = s; el.textContent = s; } };
const setHTML = (el, s) => { if (el._h !== s) { el._h = s; el.innerHTML = s; } };
const show = (el, on) => el.classList.toggle('hidden', !on);
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ---------- words ----------
const W1 = `gun run aim fire jump duck dash hit army base camp fort jet tank bomb map flag rope hill rock tree mud vine fog sun storm rain wave zone hero team unit gear boot belt helm road wall gate ammo shot blast quick brave bold calm fast tough sharp alert safe clear move push hold rush scan spy code yard nest`.split(/\s+/);
const W2 = `soldier commando jungle bridge rocket mission target cannon trooper sniper radar signal danger escape battle shield combat helmet canyon valley outpost bunker convoy patrol rescue victory courage marine captain general station tunnel engine machine assault defend advance retreat forward warrior squadron`.split(/\s+/);
const W3 = `explosion artillery battalion fortress infantry commander operation helicopter ammunition grenadier reconnaissance headquarters stronghold underground waterfall destroyer satellite laboratory dangerous invincible champion determined dimension mysterious organism`.split(/\s+/);
const PHR = ['hold the line', 'move move move', 'fire at will', 'take cover', 'lock and load', 'stay sharp', 'mission complete', 'target the core', 'never surrender', 'charge forward'];
const POWERS = { spread: { label: 'S', name: 'SPREAD GUN', color: '#ff5050' }, rapid: { label: 'R', name: 'RAPID FIRE', color: '#50a0ff' }, shield: { label: 'B', name: 'BARRIER', color: '#ffd040' }, medal: { label: '1UP', name: 'EXTRA LIFE', color: '#40e060' } };

const STAGES = [
  { name: 'JUNGLE', words: W1, boss: 'wall', bossName: 'DEFENSE WALL', bossHp: 110, bossWords: W2,
    gap: [2.4, 3.6], quota: 14, bulletSpd: 42, runSpd: [20, 30], fire: [3.5, 5.5], mix: { runner: 4, rifle: 3, turret: 1, drone: 1 } },
  { name: 'ENEMY BASE', words: W1.concat(W2), boss: 'tank', bossName: 'WAR TANK', bossHp: 150, bossWords: W2.concat(W3),
    gap: [2.0, 3.1], quota: 18, bulletSpd: 50, runSpd: [24, 36], fire: [3.0, 4.6], mix: { runner: 3, rifle: 3, turret: 2, drone: 2 } },
  { name: 'ALIEN HIVE', words: W2.concat(W3), boss: 'heart', bossName: 'ALIEN HEART', bossHp: 190, bossWords: W3.concat(PHR),
    gap: [1.8, 2.7], quota: 22, bulletSpd: 56, runSpd: [28, 42], fire: [2.6, 4.0], mix: { runner: 4, rifle: 2, turret: 2, drone: 3 } },
];

// ---------- audio ----------
let ac = null, musicGain = null, noiseBuf = null, musicOn = true, sfxOn = true;
function ensureAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      musicGain = ac.createGain();
      musicGain.gain.value = musicOn ? 1 : 0;
      musicGain.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      startMusic();
    } catch (e) {}
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
const mtof = m => 440 * 2 ** ((m - 69) / 12);
function playNote(dest, f0, f1, t, dur, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(dest);
  o.start(t); o.stop(t + dur + .02);
}
function playNoise(dest, t, dur, vol, freq, ftype) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(dest);
  s.start(t, Math.random() * .5); s.stop(t + dur + .02);
}
function tone(f0, f1, dur, type = 'square', vol = .06, delay = 0) {
  if (!ac || !sfxOn) return;
  playNote(ac.destination, f0, f1, ac.currentTime + delay, dur, type, vol);
}
function noise(dur, vol, freq, ftype = 'lowpass', delay = 0) {
  if (!ac || !sfxOn) return;
  playNoise(ac.destination, ac.currentTime + delay, dur, vol, freq, ftype);
}
const SFX = {
  key: () => tone(1500, 0, .02, 'square', .015),
  wrong: () => tone(120, 80, .12, 'sawtooth', .06),
  shoot: () => { tone(900, 200, .08, 'square', .05); noise(.06, .15, 3000, 'highpass'); },
  boom: big => { noise(big ? .5 : .25, big ? .5 : .3, big ? 500 : 900); tone(big ? 120 : 200, 40, big ? .4 : .18, 'square', .08); },
  power: () => [0, 4, 7, 12].forEach((m, i) => tone(mtof(72 + m), 0, .08, 'square', .05, i * .06)),
  die: () => { tone(600, 60, .7, 'square', .08); noise(.5, .3, 700); },
  alarm: () => { for (let i = 0; i < 3; i++) { tone(880, 0, .12, 'square', .05, i * .3); tone(660, 0, .12, 'square', .05, i * .3 + .15); } },
  clear: () => [0, 4, 7, 12, 7, 12, 16].forEach((m, i) => tone(mtof(67 + m), 0, .12, 'square', .05, i * .1)),
  select: () => tone(660, 990, .08, 'square', .05),

const BASS = [40, 40, 52, 40, 43, 40, 50, 40, 38, 38, 50, 38, 43, 45, 47, 50];
const LEAD = [64, 0, 67, 69, 0, 67, 64, 0, 62, 0, 64, 67, 0, 64, 62, 59];
const music = { step: 0, next: 0, timer: null };
function startMusic() {
  if (music.timer || !ac) return;
  music.next = ac.currentTime + .1; music.step = 0;
  music.timer = setInterval(scheduleMusic, 25);
}
function scheduleMusic() {
  const spb = 60 / 150 / 2;
  while (music.next < ac.currentTime + .12) {
    const t = music.next, s = music.step % 16;
    playNote(musicGain, mtof(BASS[s]), 0, t, spb * .8, 'triangle', .08);
    if (s % 4 === 0) playNote(musicGain, 140, 40, t, .15, 'sine', .22);
    if (s % 4 === 2) playNoise(musicGain, t, .1, .1, 1800, 'bandpass');
    if (s % 2 === 1) playNoise(musicGain, t, .04, .04, 7000, 'highpass');
    if (music.step % 64 >= 32 && LEAD[s]) playNote(musicGain, mtof(LEAD[s]), 0, t, spb * .9, 'square', .022);
    music.next += spb; music.step++;

}

// ---------- three.js ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 16 / 9, .1, 200);
const CAM = new THREE.Vector3(0, 4.6, 21), LOOK = new THREE.Vector3(0, 3.1, 0);

function resize() {
  const w = Math.max(300, Math.min(innerWidth - 24, (innerHeight - 70) * 16 / 9));
  const h = w * 9 / 16;
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
  wrap.style.fontSize = (w / 64) + 'px';
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const hemi = new THREE.HemisphereLight('#cfe6ff', '#4a3a20', 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff4dd', 2.2);
sun.position.set(-6, 14, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 1024);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 10, bottom: -3, near: 1, far: 50 });
sun.shadow.bias = -.0006;
scene.add(sun);
const flashLight = new THREE.PointLight('#ffaa40', 0, 14, 2);
scene.add(flashLight);

function canvasTex(w, h, paint) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const stdMat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: o.r ?? .7, metalness: o.m ?? 0, emissive: o.e ?? '#000000', emissiveIntensity: o.ei ?? 1, flatShading: !!o.flat, side: o.side ?? THREE.FrontSide, transparent: !!o.t, opacity: o.o ?? 1 });
const basic = (color, o = {}) => new THREE.MeshBasicMaterial({ color, transparent: !!o.t, opacity: o.o ?? 1, blending: o.add ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !o.add, side: o.side ?? THREE.FrontSide });

  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = shadow;
  return m;
}

// ---------- characters ----------
const JOINTS = ['spine', 'neck', 'shL', 'elL', 'shR', 'elR', 'hipL', 'knL', 'hipR', 'knR'];
function buildHuman(o) {
  const M = { top: stdMat(o.top), pants: stdMat(o.pants), skin: stdMat(o.skin, { r: .6 }), boot: stdMat(o.boot || '#2a1c12'), gear: stdMat('#2a2c30', { m: .5, r: .45 }), acc: stdMat(o.acc || '#d22020') };
  const root = new THREE.Group(), fall = new THREE.Group(), hips = new THREE.Group();
  root.add(fall); fall.add(hips); hips.position.y = 1.0;
  const J = {};
  hips.add(mesh(new THREE.BoxGeometry(.42, .22, .27), M.pants));
  const spine = new THREE.Group(); spine.position.y = .1; hips.add(spine); J.spine = spine;
  const torso = mesh(new THREE.CapsuleGeometry(.22, .34, 6, 14), o.bare ? M.skin : M.top, 0, .32, 0); torso.scale.set(1.1, 1, .75); spine.add(torso);
  if (o.bare) {
    const strap = mesh(new THREE.BoxGeometry(.05, .62, .36), M.boot, 0, .34, 0); strap.rotation.z = -.6; spine.add(strap);
  } else {
    spine.add(mesh(new THREE.BoxGeometry(.4, .3, .32), M.gear, 0, .36, 0));
  }
  const belt = mesh(new THREE.CylinderGeometry(.25, .25, .08, 18), M.boot, 0, .04, 0); belt.scale.z = .78; spine.add(belt);
  const neck = new THREE.Group(); neck.position.y = .64; spine.add(neck); J.neck = neck;
  neck.add(mesh(new THREE.SphereGeometry(.16, 20, 16), M.skin, 0, .18, 0));
  for (const s of [-1, 1]) neck.add(mesh(new THREE.BoxGeometry(.04, .03, .02), basic('#111111'), s * .055, .2, .15, false));
  if (o.head === 'bandana') {
    neck.add(mesh(new THREE.SphereGeometry(.165, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2.2), stdMat('#1a120c'), 0, .2, -.01));
    const band = mesh(new THREE.CylinderGeometry(.168, .168, .06, 20, 1, true), M.acc, 0, .25, 0); neck.add(band);
    const tails = new THREE.Group(); tails.position.set(0, .25, -.16); neck.add(tails); J.tails = tails;
    for (const s of [-1, 1]) { const t = mesh(new THREE.BoxGeometry(.05, .02, .34), M.acc, s * .03, 0, -.16); t.rotation.y = s * .25; tails.add(t); }
  } else if (o.head === 'helmet') {
    neck.add(mesh(new THREE.SphereGeometry(.2, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), M.top, 0, .22, 0));
    const brim = mesh(new THREE.CylinderGeometry(.22, .22, .025, 20), M.top, 0, .22, 0); neck.add(brim);

  }

    const sh = new THREE.Group(); sh.position.set(s * .3, .54, 0); spine.add(sh); J['sh' + k] = sh;
    sh.add(mesh(new THREE.SphereGeometry(.095, 12, 10), o.bare ? M.skin : M.top));
    sh.add(mesh(new THREE.CapsuleGeometry(.072, .22, 4, 10), o.bare ? M.skin : M.top, 0, -.16, 0));
    const el = new THREE.Group(); el.position.y = -.33; sh.add(el); J['el' + k] = el;
    el.add(mesh(new THREE.CapsuleGeometry(.064, .2, 4, 10), M.skin, 0, -.13, 0));

function usedFirsts() {
  const s = new Set();
  for (const t of targets) if (!t.doomed) s.add(t.word[0]);
  return s;
}
function pickWord(pool) {
  const used = usedFirsts();
  const free = pool.filter(w => !used.has(w[0]));
  return pick(free.length ? free : pool);
}
function pickLetter() {
  const used = usedFirsts();
  const rest = lock ? lock.word.slice(lock.pos) : '';
  const all = 'abcdefghijklmnopqrstuvwxyz'.split('');
  let free = all.filter(c => !used.has(c) && !rest.includes(c));
  if (!free.length) free = all.filter(c => !used.has(c));
  return pick(free.length ? free : all);
}

    for (let i = 0; i < 6; i++) { const v = mesh(new THREE.TorusGeometry(rnd(1.2, 1.9), .07, 6, 20, rnd(1.5, 3)), stdMat('#6a0a20'), rnd(-.5, .5), rnd(-.5, .8), .9); v.rotation.z = rnd(0, 6); heart.add(v); }
    const core = mesh(new THREE.SphereGeometry(.5, 18, 12), stdMat('#ffd040', { e: '#ffb000', ei: 1.4 }), -1.3, 0, 1.4); heart.add(core);

// ---------- spawning ----------
function addTarget(o) {
  const t = Object.assign({ id: nextId++, pos: 0, err: 0, t: 0, doomed: false, dead: false, vx: 0, vy: 0 }, o);
  t.obj = makeObj(t);
  targets.push(t);
  return t;
}
function spawnEnemy() {
  const m = cfg.mix, total = m.runner + m.rifle + m.turret + m.drone;
  let r = Math.random() * total, kind;
  for (const k of ['runner', 'rifle', 'turret', 'drone']) { r -= m[k]; if (r < 0) { kind = k; break; } }
  kind = kind || 'runner';
  const base = { kind, x: W + 14, y: GROUND, fireT: rnd(...cfg.fire) * .6 };
  if (kind === 'runner') Object.assign(base, { word: pickWord(cfg.words.filter(w => w.length <= 6)), spd: rnd(...cfg.runSpd) });
  if (kind === 'rifle') Object.assign(base, { word: pickWord(cfg.words), spd: 40, stopX: rnd(220, 330) });
  if (kind === 'turret') Object.assign(base, { word: pickWord(cfg.words.filter(w => w.length >= 5).concat(W2)) });
  if (kind === 'drone') Object.assign(base, { word: pickWord(cfg.words), y: rnd(40, 80), hoverX: rnd(220, 330), spd: 50, phase: rnd(0, 6) });
  addTarget(base);

}
function spawnCapsule() {
  const opts = ['spread', 'rapid', 'shield', 'spread', 'rapid'];
  if (lives < 3) opts.push('medal', 'medal');
  const p = pick(opts);
  addTarget({ kind: 'capsule', power: p, word: p, x: W + 10, y: rnd(32, 60), spd: 32, phase: rnd(0, 6) });
}
function fireAt(x, y, kind = 'bullet') {
  const tx = PX + 2, ty = GROUND - 18;
  const d = Math.hypot(tx - x, ty - y), sp = cfg.bulletSpd * (kind === 'bomb' ? .85 : 1);
  addTarget({ kind, word: pickLetter(), x, y, vx: (tx - x) / d * sp, vy: (ty - y) / d * sp });
}
function startBoss() {
  bossPhase = true;
  showBanner('WARNING!', 'red', cfg.bossName + ' APPROACHING', 2.4);
  SFX.alarm();
  const b = { kind: 'boss', type: cfg.boss, word: pickWord(cfg.bossWords), hp: cfg.bossHp, maxHp: cfg.bossHp, x: W + 90, homeX: 0, fireT: 3, spawnT: 6 };
  if (b.type === 'wall') { b.homeX = 330; b.cy = 112; }
  if (b.type === 'tank') { b.homeX = 320; b.cy = 128; }
  if (b.type === 'heart') { b.homeX = 330; b.cy = 104; }
  b.y = b.cy;
  boss = addTarget(b);
}

// ---------- flow ----------
let player = null;
function newGame() {

  lives = extraLives ? 30 : 3;
  weapon = 'normal';
  startStage();
}
function clearTargets() {
  for (const t of targets) if (t.obj) scene.remove(t.obj);
  targets = [];
  for (const s of shots) scene.remove(s.m);
  shots = [];
  for (const p of parts) scene.remove(p.m);
  parts = [];
  for (const b of booms) scene.remove(b.m);

}
function startStage() {

  clearTargets();
  buildStage(stageI);
  lock = null; scroll = 0; spawnT = 3; spawned = 0; bossPhase = false; boss = null;
  shieldT = 0; invT = 0; dead = false; streak = 0;
  stageStats = freshStats();
  state = 'intro'; stateT = 0;
  showBanner(`STAGE ${stageI + 1}`, 'gold', cfg.name, 2.4);
  renderScreen();
}
function stageClear() {
  state = 'clear'; stateT = 0;

  score += 3000 + bonus;
  stageStats.bonus = bonus;
  saveBest();
  SFX.clear();

}
function gameOver() { state = 'gameover'; stateT = 0; saveBest(); renderScreen(); }
function saveBest() {

}

// ---------- typing ----------
function addCorrect() { stats.correct++; stageStats.correct++; }
function addWrong() { stats.wrong++; stageStats.wrong++; }
function handleChar(ch) {
  if (paused || state !== 'play' || dead) return;
  ch = ch.toLowerCase();
  if (lock && (lock.dead || lock.doomed)) lock = null;
  if (lock && lock.word[lock.pos] !== ch) {
    // an incoming bullet/bomb letter interrupts the current word without breaking it
    const b = targets.find(t => (t.kind === 'bullet' || t.kind === 'bomb') && !t.doomed && t.word === ch);
    if (b) { addCorrect(); SFX.key(); b.t0 = clock; fire(b); return; }
  }
  if (!lock) {
    const c = targets.filter(t => !t.doomed && t.word[0] === ch && t.x < W - 4);
    if (!c.length) return miss();
    c.sort((a, b) => danger(b) - danger(a));
    lock = c[0]; lock.pos = 0; lock.err = 0; lock.t0 = clock;
  }
  if (lock.word[lock.pos] === ch) {
    lock.pos++; addCorrect(); SFX.key();
    if (lock.pos >= lock.word.length) { const t = lock; lock = null; fire(t); }
  } else {
    lock.err++;
    miss();
  }
}
function danger(t) {
  if (t.kind === 'bullet' || t.kind === 'bomb') return 1000 - Math.hypot(t.x - PX, t.y - GROUND);
  if (t.kind === 'runner') return 600 - t.x;
  return 300 - t.x;
}
function miss() {
  addWrong();

  streak = 0; errFlash = .25;
  SFX.wrong();
}
function releaseLock() { if (lock) { lock.pos = 0; lock = null; } }

const shotGeo = new THREE.CapsuleGeometry(.07, .5, 4, 8);
function fire(t) {
  const n = t.word.length;
  const dt = Math.max(.05, clock - (t.t0 || clock));
  const wpm = n > 1 ? (n - 1) / dt * 12 : 60;
  const sm = n > 1 ? clamp(wpm / 40, .5, 3) : 1;
  if (t.err === 0) { streak++; stats.maxStreak = Math.max(stats.maxStreak, streak); stageStats.maxStreak = Math.max(stageStats.maxStreak, streak); }
  const gx = PX + 22, gy = GROUND - 25;
  const tx = t.x, ty = t.kind === 'boss' ? t.cy : t.kind === 'bullet' || t.kind === 'bomb' || t.kind === 'drone' || t.kind === 'capsule' ? t.y : t.y - (t.kind === 'turret' ? 14 : 22);
  const dur = clamp(Math.hypot(tx - gx, ty - gy) / 700, .04, .4);
  const spread = weapon === 'spread';
  const color = weapon === 'rapid' ? '#60b0ff' : weapon === 'spread' ? '#ff6060' : '#fff2a0';
  const mk = (tx2, ty2, target) => {
    const m = new THREE.Mesh(shotGeo, basic(color));
    m.add(new THREE.Mesh(new THREE.SphereGeometry(.2, 8, 6), basic(color, { t: true, o: .45, add: true })));
    scene.add(m);
    m.rotation.z = Math.atan2(-(ty2 - gy), tx2 - gx) - Math.PI / 2;
    shots.push({ m, fx: gx, fy: gy, tx: tx2, ty: ty2, t: 0, dur, target, sm, clean: t.err === 0, spread });
  };
  mk(tx, ty, t);
  if (spread) for (const a of [-1, 1]) mk(tx + 4, ty + a * 14, null);
  if (player) player.flashT = .08;
  SFX.shoot();
  if (t.kind === 'boss') { t.word = pickWord(cfg.bossWords.filter(w => w !== t.word)); t.pos = 0; t.err = 0; }
  else { t.doomed = true; t.vx *= .2; t.vy *= .2; }
}
function shotLands(s) {
  const t = s.target;
  if (!t || t.dead) return;
  if (t.kind === 'boss') {
    if (state !== 'play' || !boss) return;
    const dmg = Math.round((5 + t.word.length * .4 + 4) * clamp(s.sm, .6, 2.2) * (weapon === 'rapid' ? 1.6 : 1) * (s.clean ? 1.15 : 1));
    boss.hp = Math.max(0, boss.hp - dmg);
    boss.flash = .12;
    popup(`-${dmg}`, s.tx, s.ty - 16, '#fff');
    explode(s.tx + rnd(-6, 6), s.ty + rnd(-6, 6), false);
    score += dmg * 20;
    if (boss.hp <= 0) bossDown();
    return;
  }
  t.dead = true;
  const small = t.kind === 'bullet' || t.kind === 'bomb';
  explode(t.x, small ? t.y : t.y - 14, t.kind === 'turret' || t.kind === 'drone');
  if (t.kind === 'capsule') return powerUp(t.power);
  const base = small ? 50 : 100 + t.word.length * 20;
  const mult = s.sm * (1 + Math.min(streak, 20) * .05) * (weapon === 'rapid' ? 1.5 : 1);
  const pts = Math.round(base * mult / 10) * 10;
  score += pts;
  if (!small) {
    stats.kills++; stageStats.kills++;
    const tag = s.sm >= 2 ? '  BLAZING!' : s.sm >= 1.5 ? '  FAST!' : '';
    popup(`+${pts}${tag}`, t.x, t.y - 48, s.sm >= 1.5 ? '#ffd23f' : '#fff', 'sm');
  }
  if (s.spread) {
    for (const b of targets) if ((b.kind === 'bullet' || b.kind === 'bomb') && !b.doomed && !b.dead) { b.dead = true; explode(b.x, b.y, false); score += 50; }
  }
}
function powerUp(p) {
  SFX.power();
  const P = POWERS[p];
  if (p === 'medal') lives++;
  else if (p === 'shield') shieldT = 10;
  else weapon = p;
  popup(P.name + '!', PX + 30, GROUND - 60, P.color);
  score += 500;
}
function bossDown() {
  const b = boss;
  b.doomed = true; lock = null;
  for (const t of targets) if (t !== b && !t.dead) { t.dead = true; explode(t.x, t.y - 6, false); }
  for (let i = 0; i < 10; i++) setTimeout(() => explode(b.x + rnd(-40, 40), b.cy + rnd(-50, 50), true), i * 140);
  shake = .5; flashT = .4;
  score += 10000;
  showBanner('DESTROYED!', 'gold', '+10000', 2);
  state = 'bossdown'; stateT = 0;
}
function playerHit() {
  if (dead || invT > 0 || state !== 'play') return;
  if (shieldT > 0) return;
  lives--; dead = true; deathT = 0;
  stats.deaths++; stageStats.deaths++;
  weapon = 'normal'; streak = 0; lock = null;
  for (const t of targets) if ((t.kind === 'bullet' || t.kind === 'bomb') && !t.dead) { t.dead = true; explode(t.x, t.y, false); }
  shake = .35; flashT = .3;
  SFX.die();
  popup('OUCH!', PX, GROUND - 56, '#ff5050');
}

// ---------- update ----------
function update(dt) {
  clock += dt; stateT += dt;
  if (state === 'intro') {
    scroll += scrollSpd * dt; scrollScenery(scrollSpd * dt / 20);
    if (stateT > 2.4) state = 'play';
  } else if (state === 'play') updatePlay(dt);
  else if (state === 'bossdown') { if (stateT > 2.6) stageClear(); }
  else if (state === 'title') scrollScenery(dt * .6);
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.t += dt;
    const k = Math.min(1, s.t / s.dur);
    s.m.position.set(WX(s.fx + (s.tx - s.fx) * k), WY(s.fy + (s.ty - s.fy) * k), .3);
    if (k >= 1) { scene.remove(s.m); shots.splice(i, 1); shotLands(s); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt; p.v.y -= 12 * dt; p.m.position.addScaledVector(p.v, dt);
    p.m.scale.setScalar(Math.max(.01, 1 - p.t / p.life));
    if (p.t >= p.life) { scene.remove(p.m); parts.splice(i, 1); }
  }
  for (let i = booms.length - 1; i >= 0; i--) {
    const b = booms[i];
    b.t += dt;
    const k = b.t / .4;
    b.m.scale.setScalar(b.r * (.3 + k));
    b.m.material.opacity = Math.max(0, 1 - k);
    b.m.material.color.set(k < .3 ? '#ffffff' : '#ff9020');
    if (b.t >= .4) { scene.remove(b.m); booms.splice(i, 1); }
  }
  flashLight.intensity = Math.max(0, flashLight.intensity - dt * 160);
  if (banner) { banner.t += dt; if (banner.t > banner.life) { banner = null; bannerEl.className = 'hidden'; } }
  shake = Math.max(0, shake - dt * 1.2);
  flashT = Math.max(0, flashT - dt);
  errFlash = Math.max(0, errFlash - dt);
}
function updatePlay(dt) {
  stats.time += dt; stageStats.time += dt;
  if (shieldT > 0) shieldT -= dt;
  if (invT > 0) invT -= dt;
  if (dead) {
    deathT += dt;
    if (deathT > 1.4) {
      if (lives <= 0) return gameOver();
      dead = false; invT = 2.5;
    }
  }
  const ws = bossPhase ? 0 : scrollSpd;
  scroll += ws * dt;
  scrollScenery(ws * dt / 20);

  if (!bossPhase) {
    spawnT -= dt;
    const alive = targets.some(t => !t.dead && ['runner', 'rifle', 'turret', 'drone'].includes(t.kind));
    if (spawnT <= 0 && spawned < cfg.quota) { spawnEnemy(); spawnT = rnd(...cfg.gap); }
    if (spawned >= cfg.quota && !alive) startBoss();
  }

  for (const t of targets) {
    if (t.dead) continue;
    t.t += dt;
    if (t.doomed && t.kind !== 'boss') continue;
    switch (t.kind) {
      case 'runner':
        t.x -= (t.spd + ws) * dt;
        if (t.x < PX + 12) { t.dead = true; explode(t.x, t.y - 14, false); if (lock === t) lock = null; playerHit(); }
        break;
      case 'rifle':
        if (t.x > t.stopX) t.x -= (t.spd + ws) * dt; else t.x -= ws * dt;
        t.fireT -= dt;
        if (t.fireT <= 0 && t.x < W - 10 && !dead) { fireAt(t.x - 16, t.y - 26); t.fireT = rnd(...cfg.fire); t.muzzle = .1; }
        if (t.x < PX + 14) { t.dead = true; explode(t.x, t.y - 14, false); if (lock === t) lock = null; playerHit(); }
        break;
      case 'turret':
        t.x -= ws * dt;
        t.fireT -= dt;
        if (t.fireT <= 0 && t.x < W - 10 && t.x > PX + 40 && !dead) { fireAt(t.x - 22, t.y - 18); t.fireT = rnd(...cfg.fire) * .9; t.muzzle = .1; }
        if (t.x < PX + 18) { t.dead = true; explode(t.x, t.y - 8, true); if (lock === t) lock = null; }
        break;
      case 'drone':
        if (t.x > t.hoverX) t.x -= t.spd * dt;
        t.y += Math.sin(t.t * 2 + t.phase) * 12 * dt;
        t.fireT -= dt;
        if (t.fireT <= 0 && t.x < W - 10 && !dead) { fireAt(t.x, t.y + 10, 'bomb'); t.fireT = rnd(...cfg.fire) * 1.1; }
        break;
      case 'capsule':
        t.x -= t.spd * dt;
        t.y += Math.cos(t.t * 2.5 + t.phase) * 18 * dt;
        if (t.x < -20) { t.dead = true; if (lock === t) lock = null; }
        break;
      case 'bullet': case 'bomb':
        t.x += t.vx * dt; t.y += t.vy * dt;
        if (Math.hypot(t.x - (PX + 2), t.y - (GROUND - 18)) < 9) {
          t.dead = true; if (lock === t) lock = null;
          if (shieldT > 0 || invT > 0) explode(t.x, t.y, false); else playerHit();
        }
        if (t.x < -10 || t.y > H) t.dead = true;
        break;
      case 'boss':
        if (t.x > t.homeX) t.x = Math.max(t.homeX, t.x - 40 * dt);
        if (t.flash) t.flash = Math.max(0, t.flash - dt);
        if (t.x <= t.homeX + 1 && !dead) {
          t.fireT -= dt;
          if (t.fireT <= 0) {
            const guns = t.type === 'wall' ? [[t.x - 30, 70], [t.x - 30, 150]] : t.type === 'tank' ? [[t.x - 70, 126]] : [[t.x - 40, t.cy - 20], [t.x - 40, t.cy + 20]];
            const g = pick(guns);
            fireAt(g[0], g[1], t.type === 'heart' ? 'bomb' : 'bullet');
            t.fireT = rnd(...cfg.fire) * .75;
          }
          t.spawnT -= dt;
          if (t.spawnT <= 0) {
            addTarget({ kind: 'runner', x: t.x - 60, y: GROUND, word: pickWord(cfg.words.filter(w => w.length <= 6)), spd: rnd(...cfg.runSpd), fireT: 9 });
            t.spawnT = rnd(7, 11) - stageI;
          }
        }
        break;
    }
  }
  for (const t of targets) if (t.dead && t.obj) { scene.remove(t.obj); t.obj = null; }
  targets = targets.filter(t => !t.dead);
  if (lock && lock.dead) lock = null;
}

// ---------- scene sync ----------
let playerModel = null, shieldMesh = null;
function ensurePlayer() {
  if (playerModel) return;
  playerModel = buildHuman({ top: '#e0a070', pants: '#2850c8', skin: '#e0a070', bare: true, head: 'bandana', acc: '#e02020', boot: '#3a2414', scale: 1 });
  scene.add(playerModel.root);
  shieldMesh = new THREE.Mesh(new THREE.SphereGeometry(1.25, 24, 16), basic('#ffd040', { t: true, o: .22, add: true }));
  scene.add(shieldMesh);
}
function syncScene(dt) {
  ensurePlayer();
  const h = playerModel;
  const running = state === 'intro' || state === 'title' || (state === 'play' && !bossPhase);
  const tgt = lock && !lock.dead ? lock : null;
  const aimUp = tgt ? clamp(((GROUND - 25) - (tgt.kind === 'boss' ? tgt.cy : tgt.y - 10)) / 120, -.3, 1) : 0;
  h.root.position.set(WX(PX), 0, 0);
  h.root.rotation.y = Math.PI / 2 - .35;
  if (dead) {
    const k = Math.min(1, deathT / .35);
    h.fall.rotation.x = -k * Math.PI / 2; h.fall.position.y = k * .25;
    h.root.position.x = WX(PX) - k * .6;
  } else {
    h.fall.rotation.x = 0; h.fall.position.y = 0;
    runPose(h, clock, 11, Math.max(0, aimUp), !running);
  }
  h.root.visible = !(invT > 0 && Math.sin(clock * 30) > 0);
  h.flashT = Math.max(0, h.flashT - dt); h.flash.visible = h.flashT > 0;
  shieldMesh.visible = shieldT > 0 && state === 'play';
  shieldMesh.position.set(WX(PX), 1.0, 0);
  shieldMesh.material.opacity = .15 + Math.sin(clock * 10) * .08;

  for (const t of targets) {
    const o = t.obj;
    if (!o) continue;
    o.visible = !t.doomed || t.kind === 'boss';
    switch (t.kind) {
      case 'runner': case 'rifle': {
        o.position.set(WX(t.x), 0, 0);
        if (o.userData.bug) {
          o.userData.bug.userData.legs.forEach((l, i) => { l.rotation.z = Math.sin(clock * 18 + i) * .4; });
          o.userData.bug.position.y = Math.abs(Math.sin(clock * 18)) * .05;
        } else {
          const moving = t.kind === 'runner' || t.x > t.stopX;
          runPose(o.userData.h, clock + t.id, moving ? 10 : 0, t.kind === 'rifle' && !moving ? .1 : 0, !moving);
          if (t.muzzle > 0) { t.muzzle -= dt; o.userData.h.flash.visible = true; } else o.userData.h.flash.visible = false;
        }
        break;
      }
      case 'turret': o.position.set(WX(t.x), 0, 0); break;
      case 'drone':
        o.position.set(WX(t.x), WY(t.y), 0);
        o.userData.rotor.rotation.y += dt * 30;
        o.userData.light.visible = Math.sin(clock * 10) > 0;
        o.rotation.z = Math.sin(t.t * 2 + t.phase) * .08;
        break;
      case 'capsule':
        o.position.set(WX(t.x), WY(t.y), 0);
        o.userData.wings.forEach((w, i) => { w.rotation.x = (i ? 1 : -1) * Math.sin(clock * 14) * .5; });
        o.rotation.x += dt * 1.5;
        break;
      case 'bullet': case 'bomb':
        o.position.set(WX(t.x), WY(t.y), .3);
        o.scale.setScalar(1 + Math.sin(clock * 20) * .1);
        break;
      case 'boss': {
        o.position.set(WX(t.x), 0, 0);
        const core = o.userData.core;
        const pulse = 1 + Math.sin(clock * 6) * .12;
        core.scale.setScalar(pulse);
        core.material.emissiveIntensity = t.flash > 0 ? 4 : 1.5;
        if (o.userData.heart) o.userData.heart.scale.setScalar(1 + Math.sin(clock * 5) * .05);
        if (state === 'bossdown') { o.position.y = -stateT * 1.5; o.rotation.z = Math.sin(clock * 40) * .02; }
        break;
      }
    }
  }
  const sh = shake ? new THREE.Vector3(rnd(-shake, shake), rnd(-shake, shake), 0) : new THREE.Vector3();
  camera.position.copy(CAM).add(sh);
  if (state === 'title') camera.position.x += Math.sin(clock * .3) * 1.5;
  camera.lookAt(LOOK);
}

const labelEls = new Map();
function overallWpm(s = stats) { return s && s.time > 3 ? Math.round(s.correct / 5 / (s.time / 60)) : 0; }
function accuracy(s = stats) { return s && s.correct + s.wrong ? Math.round(100 * s.correct / (s.correct + s.wrong)) : 100; }
function grade(s) { const g = overallWpm(s) * (accuracy(s) / 100) ** 2; return g >= 60 ? 'S' : g >= 45 ? 'A' : g >= 30 ? 'B' : g >= 18 ? 'C' : 'D'; }
function anchor(t) {
  if (t.kind === 'boss') return [WX(t.x) - 1.2, WY(t.cy) + 2.4];
  if (t.kind === 'drone') return [WX(t.x), WY(t.y) + .8];
  if (t.kind === 'capsule') return [WX(t.x), WY(t.y) + .6];
  if (t.kind === 'turret') return [WX(t.x), 1.6];
  if (t.kind === 'bullet' || t.kind === 'bomb') return [WX(t.x), WY(t.y)];
  return [WX(t.x), 2.35];
}
function syncLabels() {
  const live = new Set();
  if (state === 'play') for (const t of targets) {
    if (t.dead || t.doomed) continue;
    live.add(t.id);
    let el = labelEls.get(t.id);
    const small = t.kind === 'bullet' || t.kind === 'bomb';
    if (!el) {
      el = document.createElement('div');
      el.className = small ? 'bl' + (t.kind === 'bomb' ? ' bomb' : '') : 'lbl' + (t.kind === 'capsule' ? ' cap' : '') + (t.kind === 'boss' ? ' boss' : '');
      if (t.kind === 'capsule') el.style.setProperty('--c', POWERS[t.power].color);
      labelsEl.appendChild(el); labelEls.set(t.id, el);
    }
    const [ax, ay] = anchor(t);
    const [sx, sy] = toScreen(ax, ay, small ? .3 : 0);
    el.style.left = clamp(sx, 4, 96) + '%'; el.style.top = clamp(sy, 8, 98) + '%';
    if (small) setText(el, t.word);
    else {
      const locked = lock === t;
      const w = t.word.replace(/ /g, '·');
      setHTML(el, locked ? `<span class="d">${esc(w.slice(0, t.pos))}</span>${esc(w.slice(t.pos))}` : esc(w));
      el.classList.toggle('lock', locked);
    }
  }
  for (const [id, el] of labelEls) if (!live.has(id)) { el.remove(); labelEls.delete(id); }
}
function renderUI() {
  const playing = ['intro', 'play', 'bossdown'].includes(state);
  show(ui.top, playing); show(ui.bottom, playing);
  if (playing) {
    const n = Math.min(lives, 6);
    setHTML(ui.lives, '<i class="medal"></i>'.repeat(Math.max(0, n)) + (lives > 6 ? `<span id="livesX">×${lives}</span>` : ''));
    setText(ui.score, `1P  ${score}`);
    setText(ui.stageName, `STAGE ${stageI + 1} · ${cfg.name}`);
    const wp = weapon === 'normal' ? 'RIFLE' : POWERS[weapon].name;
    setHTML(ui.weapon, `<span style="color:${weapon === 'normal' ? '#9ab' : POWERS[weapon].color}">${wp}</span>${shieldT > 0 ? ' · <span style="color:#ffd040">BARRIER</span>' : ''}`);
    setText(ui.wpm, `${overallWpm()} WPM`); setText(ui.acc, `${accuracy()}%`); setText(ui.streak, streak >= 2 ? `STREAK ${streak}` : '');
    show(ui.prog, !bossPhase);
    ui.progFill.style.width = Math.min(100, spawned / cfg.quota * 100) + '%';
  }
  show(ui.bossBar, playing && bossPhase && !!boss);
  if (boss) { ui.bossFill.style.width = boss.hp / boss.maxHp * 100 + '%'; setText(ui.bossName, cfg.bossName); }
  ui.flash.style.opacity = flashT > 0 ? flashT : 0;
  ui.errbar.style.opacity = errFlash > 0 ? 1 : 0;
  syncLabels();
}
function statsHTML(s) {
  return `<div class="stats"><div>Speed <b>${overallWpm(s)} WPM</b></div><div>Accuracy <b>${accuracy(s)}%</b></div>
    <div>Kills <b>${s.kills}</b></div><div>Best streak <b>${s.maxStreak}</b></div><div>Score <b>${score}</b></div>
    <div class="rank" style="justify-content:center">RANK ${grade(s)}</div></div>`;
}
function renderScreen() {
  let h = '';
  if (state === 'title') {
    h = `<div class="center" style="background:rgba(0,0,0,.25)"><div class="logo1 stroke">TYPE</div><div class="logo2">COMMANDO</div>
      <div class="howto">Type a word to <b>shoot</b> that enemy · Faster typing = <b>more points</b><br>
      Incoming bullet <span class="bl">k</span> = type its letter to shoot it down<br>
      Shoot flying capsules for <b>power-ups</b> · Backspace = switch target</div>
      <div class="prompt stroke">PRESS ENTER</div>
      ${extraLives ? '<div class="muted" style="color:var(--green)">30 LIVES!</div>' : best ? `<div class="muted">Best score ${best}</div>` : ''}</div>`;
  } else if (state === 'clear') {
    h = `<div class="center" style="background:rgba(0,0,0,.6)"><div class="big stroke" style="color:var(--gold)">STAGE ${stageI + 1} CLEAR!</div>${statsHTML(stageStats)}
      <div class="muted" style="color:var(--green)">${stageStats.bonus ? 'NO-DEATH BONUS +5000' : 'CLEAR BONUS +3000'}</div>
      <div class="prompt stroke">${stageI + 1 < STAGES.length ? 'ENTER = NEXT STAGE' : 'ENTER = FINISH'}</div></div>`;
  } else if (state === 'win') {
    h = `<div class="center" style="background:rgba(0,0,0,.6)"><div class="big stroke" style="color:var(--green)">MISSION COMPLETE!</div>${statsHTML(stats)}
      ${score >= best ? '<div class="muted" style="color:var(--green)">NEW BEST!</div>' : ''}<div class="prompt stroke">PRESS ENTER</div></div>`;
  } else if (state === 'gameover') {
    h = `<div class="center" style="background:rgba(0,0,0,.65)"><div class="big stroke" style="color:var(--red)">GAME OVER</div>${statsHTML(stats)}
      <div class="prompt stroke">ENTER = CONTINUE STAGE</div><div class="muted">ESC = title</div></div>`;
  }
  if (paused) h += `<div class="center" style="background:rgba(0,0,0,.6)"><div class="big stroke" style="color:var(--gold)">PAUSED</div><div class="prompt">ESC TO RESUME</div></div>`;
  screenEl.innerHTML = h;
}

// ---------- input ----------
const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
function onEnter() {
  if (paused) return;
  if (state === 'title') { SFX.select(); newGame(); }
  else if (state === 'clear') {
    if (stageI + 1 < STAGES.length) { stageI++; startStage(); }
    else { state = 'win'; stateT = 0; saveBest(); renderScreen(); }
  } else if (state === 'win') goTitle();
  else if (state === 'gameover') { lives = extraLives ? 30 : 3; score = 0; weapon = 'normal'; startStage(); }
}
function goTitle() { state = 'title'; stateT = 0; clearTargets(); buildStage(0); renderScreen(); }
function togglePause() {
  if (!['intro', 'play', 'bossdown'].includes(state)) return;
  paused = !paused;
  pauseBtn.textContent = paused ? 'RESUME' : 'PAUSE';
  if (musicGain) musicGain.gain.value = musicOn && !paused ? 1 : 0;
  renderScreen();
}
kb.addEventListener('input', () => {
  const v = kb.value; kb.value = '';
  ensureAudio();
  for (const ch of v) handleChar(ch);
});
addEventListener('keydown', e => {
  ensureAudio();
  if (state === 'title') {
    konami.push(e.key); konami = konami.slice(-10);
    if (KONAMI.every((k, i) => konami[i] === k) && !extraLives) { extraLives = true; SFX.power(); renderScreen(); }
  }
  if (e.key === 'Escape') { if (state === 'gameover' || state === 'win') goTitle(); else togglePause(); e.preventDefault(); return; }
  if (e.key === 'Enter') { onEnter(); e.preventDefault(); return; }
  if (e.key === 'Backspace') { releaseLock(); e.preventDefault(); return; }
  if (e.key === 'Tab' || e.key.startsWith('Arrow')) { e.preventDefault(); return; }
  if (e.key.length === 1 && !e.metaKey && !e.ctrlKey && document.activeElement !== kb) {
    handleChar(e.key);
    e.preventDefault();
    kb.focus({ preventScroll: true });
  }
});
wrap.addEventListener('pointerdown', e => {
  ensureAudio();
  if (!['play', 'intro', 'bossdown'].includes(state)) onEnter();
  e.preventDefault();
  kb.focus({ preventScroll: true });
});
$('homeBtn').addEventListener('click', () => { window.location.href = 'https://reubenask.github.io/emerald-hills/platform.html'; });
const musicBtn = $('musicBtn'), sfxBtn = $('sfxBtn'), pauseBtn = $('pauseBtn');
musicBtn.addEventListener('click', () => {
  ensureAudio();
  musicOn = !musicOn; musicBtn.textContent = 'MUSIC: ' + (musicOn ? 'ON' : 'OFF');
  if (musicGain) musicGain.gain.value = musicOn && !paused ? 1 : 0;
  kb.focus({ preventScroll: true });
});
sfxBtn.addEventListener('click', () => {
  sfxOn = !sfxOn; sfxBtn.textContent = 'SFX: ' + (sfxOn ? 'ON' : 'OFF');
  kb.focus({ preventScroll: true });
});
pauseBtn.addEventListener('click', () => { togglePause(); kb.focus({ preventScroll: true }); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !paused && ['intro', 'play', 'bossdown'].includes(state)) togglePause();
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (!paused) update(dt);
  syncScene(dt);
  renderUI();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
goTitle();
kb.focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>
</body>
</html>
