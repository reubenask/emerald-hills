// blobby scenery shapes, drawn per-pixel so edges stay crisp
function blob(w, h, circles, fill, line, shade) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const inside = (x, y) => {
    if (x < 0 || x >= w || y < 0) return false;
    if (y >= h) return true;
    return circles.some(([cx, cy, r]) => (x + .5 - cx) ** 2 + (y + .5 - cy) ** 2 <= r * r);
  };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!inside(x, y)) continue;
    const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
    g.fillStyle = edge ? line : (shade && y > h * .62 ? shade : fill);
    g.fillRect(x, y, 1, 1);
  }
  return c;
}

// ---------- audio ----------
let ac = null, sfxOn = true, musicOn = true, musicGain = null;
function ensureAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      musicGain = ac.createGain();
      musicGain.gain.value = musicOn ? 1 : 0;
      musicGain.connect(ac.destination);
    } catch (e) {}
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
const mtof = m => 440 * 2 ** ((m - 69) / 12);
function tone(f0, f1, dur, type = 'square', vol = .06, delay = 0) {
  if (!ac || !sfxOn) return;
  playNote(ac.destination, f0, f1, ac.currentTime + delay, dur, type, vol);
}
function playNote(dest, f0, f1, t, dur, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(dest);
  o.start(t); o.stop(t + dur + .02);
}
// plays a list of [midi, delay, duration] notes
const seq = (notes, type = 'square', vol = .05) => notes.forEach(([m, d, l]) => tone(mtof(m), 0, l, type, vol, d));

// letters climb a major pentatonic scale as you get through the word, so finishing it "rises" to a peak

    const m = SCALE[Math.min(SCALE.length - 1, Math.floor(frac * SCALE.length))];
    tone(mtof(m), 0, .09, 'triangle', .09);
    tone(mtof(m + 12), 0, .04, 'square', .012);
  },
  miss:  () => tone(110, 90, .08, 'square', .05),
  done:  perfect => {

  coin:  () => seq([[83, 0, .07], [88, .07, .3]], 'square', .05),

  combo: () => seq([[79, 0, .08], [84, .08, .08], [88, .16, .08], [91, .24, .08], [96, .32, .3]], 'square', .05),
  hurt:  () => tone(500, 90, .4, 'sawtooth', .06),
  over:  () => seq([[67, 0, .25], [64, .22, .25], [60, .44, .25], [55, .66, .5]], 'triangle', .1),
  start: () => seq([[72, 0, .12], [76, .12, .12], [79, .24, .12], [84, .36, .3]]),
  clear: () => {
    seq([[72, 0, .12], [76, .12, .12], [79, .24, .12], [84, .36, .3], [79, .66, .12], [84, .78, .6]]);
    seq([[48, 0, .36], [55, .36, .3], [48, .66, .7]], 'triangle', .12);
  },
  win: () => {
    seq([[72, 0, .1], [76, .1, .1], [79, .2, .1], [84, .3, .1], [88, .4, .1], [91, .5, .3],
         [88, .8, .1], [91, .9, .1], [96, 1, .9]]);
    seq([[48, 0, .5], [53, .5, .3], [55, .8, .2], [60, 1, .9]], 'triangle', .12);

};

// background music: an original, cheerful 8-bar loop (8th-note melody, quarter-note bass)
const MELODY = [
  76, 79, 84, 79, 76, 79, 81, 79,  77, 81, 84, 81, 79, 77, 76, 74,
  74, 79, 83, 86, 84, 83, 81, 79,  76, 79, 84, 88, 86, 84, 0, 0,
  81, 84, 88, 84, 81, 84, 83, 81,  77, 81, 84, 89, 88, 84, 81, 77,
  79, 83, 86, 91, 89, 86, 83, 79,  84, 0, 79, 0, 76, 0, 72, 0,
];
const BASS = [
  48, 55, 48, 55, 41, 48, 41, 48, 43, 50, 43, 50, 48, 55, 48, 55,
  45, 52, 45, 52, 41, 48, 41, 48, 43, 50, 43, 50, 48, 43, 48, 0,
];
const music = { timer: null, step: 0, next: 0, tempo: 132 };
function startMusic(tempo) {
  if (!ac) return;
  stopMusic();
  music.tempo = tempo; music.step = 0; music.next = ac.currentTime + .1;
  music.timer = setInterval(scheduleMusic, 40);
}
function stopMusic() { clearInterval(music.timer); music.timer = null; }
function scheduleMusic() {
  const st = 60 / music.tempo / 2;
  while (music.next < ac.currentTime + .25) {
    const s = music.step, t = music.next;
    if (MELODY[s]) playNote(musicGain, mtof(MELODY[s]), 0, t, st * .9, 'square', .022);
    if (s % 2 === 0 && BASS[s / 2]) playNote(musicGain, mtof(BASS[s / 2]), 0, t, st * 1.8, 'triangle', .09);
    if (s % 2 === 1) playNote(musicGain, 6000, 3000, t, .03, 'square', .006);
    music.next += st;
    music.step = (s + 1) % MELODY.length;
  }
}

  stage++;

function saveBest() {
  if (score > best) { best = score; try { localStorage.setItem('superTyperBest', best); } catch (e) {} }
}

function gameOver() {
  state = 'over';
  stopMusic(); saveBest(); sfx.over();
}

function stageClear() {
  stopMusic();
  score += 1000;
  if (stage === STAGES.length - 1) {
    state = 'win'; saveBest(); sfx.win();
  } else {
    state = 'clear'; lives = Math.min(5, lives + 1); sfx.clear();

}

function isTargetable(t) {
  if (t.kind === 'enemy') return t.state === 'walk';
  return t.state === 'idle' && t.x > 20 && t.x < W - 20;
}
const targets = () => [...enemies, ...blocks].filter(isTargetable);

function pickWord(pool) {
  const live = [...enemies, ...blocks].filter(t => t.state === 'walk' || t.state === 'idle');
  const used = new Set(live.map(t => t.word[0]));
  for (let i = 0; i < 40; i++) {
    const w = pool[Math.random() * pool.length | 0];
    if (!used.has(w[0])) return w;
  }
  return null;
}

function spawnEnemy() {
  const c = cfg();
  const fast = stage === 0 && prog() > .4 && Math.random() < .2;
  const word = pickWord(fast ? SHORT : c.pool(prog()));
  if (!word) return false;
  // keep labels from overlapping: wait until the newest enemy has walked far enough in
  const newest = enemies.filter(e => e.state === 'walk').sort((a, b) => b.x - a.x)[0];
  if (newest && (W + 8) - newest.x < 12 + (labelWidth(newest.word) + labelWidth(word)) / 2) return false;
  enemies.push({
    kind: 'enemy', word, typed: 0, err: 0, mistakes: 0, fast,
    x: W + 8, y: GROUND - 15, speed: lerp(c.speed[0], c.speed[1], prog()) * (fast ? 1.5 : 1) * (.9 + Math.random() * .2),
    state: 'walk', anim: Math.random(), t: 0, vy: 0,
  });
  return true;
}

function spawnBlock() {
  const word = pickWord(SHORT);
  if (!word) return;
  blocks.push({ kind: 'block', word, typed: 0, err: 0, mistakes: 0, x: W + 8, y: GROUND - (stage === 2 ? 84 : 64), state: 'idle', bump: 0 });
}

function popup(text, x, y, color = '#fff') { popups.push({ text, x, y, t: 0, color }); }
function cheer(text) { praise = { text, t: 0 }; }

// ---------- typing ----------
function handleChar(ch) {
  if (state !== 'playing' || stageDone) return;
  ch = ch.toLowerCase();
  if (!/^[a-z ]$/.test(ch)) return;
  if (!lock) {
    if (ch === ' ') return;   // a stray space between words isn't a mistake
    const cands = targets().filter(t => t.word[0] === ch).sort((a, b) => a.x - b.x);
    if (!cands.length) return miss();
    lock = cands[0];
    lock.typed = 0;
  }
  if (lock.word[lock.typed] === ch) {
    lock.typed++; correct++;
    sfx.key(lock.typed / lock.word.length);
    if (lock.typed === lock.word.length) complete(lock);
  } else {
    miss();
  }
}

function miss() {
  wrong++; combo = 0; sfx.miss();
  if (lock) { lock.err = .25; lock.mistakes++; }
}

function releaseLock() {
  if (lock) { lock.typed = 0; lock = null; }
}

const PRAISE = ['NICE!', 'GOOD JOB!', 'GREAT!', 'SUPER!', 'WELL DONE!'];
function complete(t) {
  lock = null;
  combo++; bestCombo = Math.max(bestCombo, combo);
  const perfect = t.mistakes === 0;
  const pts = t.word.length * 10 + Math.min(combo, 20) * 5 + (perfect ? 20 : 0);
  score += pts;
  popup('+' + pts, t.x + 8, t.y - 14, '#ffd700');
  if (combo % 5 === 0) { cheer(combo >= 10 ? 'AMAZING!' : 'AWESOME!'); sfx.combo(); }
  else { cheer(perfect ? 'PERFECT!' : PRAISE[Math.random() * PRAISE.length | 0]); sfx.done(perfect); }
  t.state = t.kind === 'enemy' ? 'stunned' : 'claimed';
  hero.queue.push(t);
}

// ---------- hero movement ----------
function startGo(target) {
  const fromX = hero.x, fromY = hero.y;
  let toX = target.x + 2, toY, h;
  if (target.kind === 'enemy') { toY = GROUND - 28; h = 36; }
  else { toY = target.y + 16; h = 10; }
  const T = .28 + Math.abs(toX - fromX) / 700;
  if (target.kind === 'block') toX -= SCROLL * T;
  hero.act = { kind: 'go', target, fromX, fromY, toX, toY, h, T, t: 0 };
  sfx.jump();
}
function startBack() {
  const d = Math.abs(hero.x - HOME);
  hero.act = { kind: 'back', fromX: hero.x, fromY: hero.y, toX: HOME, toY: GROUND - 16, h: 14, T: .22 + d / 900, t: 0 };
}

function arrive(target) {
  if (target.kind === 'enemy') {
    target.state = 'squashed'; target.t = .45;
    sfx.stomp();
    cleared++;
    if (cleared >= cfg().goal) { stageDone = true; doneT = 1.2; }
  } else {
    target.state = 'used'; target.bump = .2;
    if (lives < 5 && Math.random() < .18) {
      items.push({ kind: 'mush', x: target.x, y: target.y, t: 0 });
      lives++; sfx.yum(); popup('1UP', target.x + 8, target.y - 20, '#7cfc00');
    } else {
      items.push({ kind: 'coin', x: target.x + 4, y: target.y - 10, t: 0 });
      coins++; score += 50; sfx.coin();
      if (coins % 25 === 0) { lives++; setTimeout(sfx.yum, 300); popup('1UP', HOME, GROUND - 40, '#7cfc00'); }
    }
  }
}

function hurt(e) {
  e.state = 'dead'; e.vy = -120;
  if (lock === e) lock = null;
  if (hero.inv > 0) return;
  lives--; hero.inv = 1.6; shake = .3; combo = 0;
  sfx.hurt();
  popup('OUCH!', HOME + 6, GROUND - 34, '#ff5050');
  if (lives <= 0) gameOver();
}

// ---------- update ----------
function update(dt) {
  if (state === 'paused') return;
  clock += dt;
  if (state !== 'over') off += SCROLL * dt;
  shake = Math.max(0, shake - dt);
  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < .9);
  if (praise) { praise.t += dt; if (praise.t > 1) praise = null; }
  if (state !== 'playing') return;

  playTime += dt;
  banner = Math.max(0, banner - dt);
  hero.inv = Math.max(0, hero.inv - dt);
  const c = cfg();

  // spawning: never put more enemies out than are still needed to clear the stage
  if (!stageDone) {
    spawnT -= dt;
    if (spawnT <= 0) {
      const active = enemies.filter(e => e.state === 'walk' || e.state === 'stunned').length;
      const room = enemies.filter(e => e.state === 'walk').length < c.maxW && active < c.goal - cleared;
      spawnT = room && !spawnEnemy() ? .3 : lerp(c.interval[0], c.interval[1], prog()) * (.7 + Math.random() * .6);
    }
    blockT -= dt;
    if (blockT <= 0) { spawnBlock(); blockT = 6 + Math.random() * 6; }
  }

  // enemies
  for (const e of enemies) {
    e.err = Math.max(0, e.err - dt);
    if (e.state === 'walk') {
      e.x -= e.speed * dt; e.anim += dt;
      if (e.x < HOME + 4) hurt(e);
    } else if (e.state === 'squashed') {
      e.t -= dt; e.x -= SCROLL * dt;
    } else if (e.state === 'dead') {
      e.vy += 420 * dt; e.y += e.vy * dt; e.x -= 20 * dt;
    }
  }
  enemies = enemies.filter(e => !(e.state === 'squashed' && e.t <= 0) && e.y < H + 20);
  if (state !== 'playing') return;   // a hit may have ended the game

  // blocks
  for (const b of blocks) {
    b.x -= SCROLL * dt;
    b.bump = Math.max(0, b.bump - dt);
    b.err = Math.max(0, b.err - dt);
  }
  blocks = blocks.filter(b => b.x > -20);

  // items
  for (const it of items) { it.t += dt; it.x -= SCROLL * dt; }
  items = items.filter(it => it.t < (it.kind === 'coin' ? .6 : 1));

  if (lock && !isTargetable(lock)) releaseLock();

  // hero
  if (!hero.act && hero.queue.length) startGo(hero.queue.shift());
  const a = hero.act;
  if (a) {
    a.t += dt;
    const p = Math.min(1, a.t / a.T);
    hero.x = a.fromX + (a.toX - a.fromX) * p;
    hero.y = a.fromY + (a.toY - a.fromY) * p - 4 * a.h * p * (1 - p);
    if (p >= 1) {
      if (a.kind === 'go') {
        arrive(a.target);
        if (hero.queue.length) startGo(hero.queue.shift()); else startBack();
      } else {
        hero.act = null; hero.y = GROUND - 16;
      }
    }
  }

  if (stageDone && !hero.act && !hero.queue.length) {
    doneT -= dt;
    if (doneT <= 0) stageClear();
  }
}

// ---------- drawing ----------
function txt(s, x, y, color = '#fff', align = 'left', size = 8) {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

// split into lines of at most `max` chars, breaking after spaces; returns [start, end) index pairs
function wrap(s, max) {
  const lines = [];
  let start = 0;
  while (start < s.length) {
    if (s.length - start <= max) { lines.push([start, s.length]); break; }
    let cut = s.lastIndexOf(' ', start + max);
    if (cut <= start) cut = start + max - 1;
    lines.push([start, cut + 1]);
    start = cut + 1;
  }
  return lines;
}

function labelWidth(word) {
  return Math.max(...wrap(word, cfg().wrap).map(([a, b]) => word.slice(a, b).trimEnd().length)) * 8;
}

function drawLabel(t, cx, bottom, clampRight) {
  const word = t.word.toUpperCase();
  const lines = wrap(word, cfg().wrap);
  const w = labelWidth(word);
  const h = lines.length * 11;
  let x = Math.round(Math.max(5, cx - w / 2));
  if (clampRight) x = Math.min(W - w - 5, x);
  const y = bottom - h;
  const active = lock === t;
  ctx.fillStyle = 'rgba(0,0,0,.65)';
  ctx.fillRect(x - 3, y - 2, w + 6, h + 1);
  if (active) { ctx.strokeStyle = t.err ? '#ff4040' : '#ffd700'; ctx.lineWidth = 1; ctx.strokeRect(x - 3.5, y - 2.5, w + 7, h + 2); }
  ctx.font = `8px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  lines.forEach(([a, b], li) => {
    for (let i = a; i < b; i++) {
      const cx = x + (i - a) * 8, cy = y + li * 11;
      const done = active && i < t.typed;
      ctx.fillStyle = done ? '#ffd700' : (t.err && i === t.typed ? '#ff4040' : '#fff');
      ctx.fillText(word[i], cx, cy);
      if (active && i === t.typed) { ctx.fillStyle = '#ffd700'; ctx.fillRect(cx, cy + 8, 7, 1); }
    }
  });
}

function drawWorld() {
  ctx.fillStyle = '#6b8cff';
  ctx.fillRect(0, 0, W, H);
  for (const s of SCENERY) {
    const sx = Math.round(((s.x - off * s.f) % P + P) % P - 100);
    if (sx < W && sx + s.img.width > 0) ctx.drawImage(s.img, sx, s.y);
  }
  const gx = -Math.round(off % 16);
  for (let x = gx; x < W; x += 16) {
    ctx.drawImage(BRICK, x, GROUND);
    ctx.drawImage(BRICK, x, GROUND + 16);
  }
}

function drawHero() {
  if (hero.inv > 0 && Math.floor(clock * 12) % 2) return;
  let img;
  if (hero.act || hero.y < GROUND - 16.5) img = HERO.jump;
  else if (state === 'over') img = HERO.runA;
  else img = Math.floor(clock * 9) % 2 ? HERO.runA : HERO.runB;
  ctx.drawImage(img, Math.round(hero.x), Math.round(hero.y));
}

function drawEntities() {
  for (const b of blocks) {
    const by = Math.round(b.y - Math.sin((b.bump / .2) * Math.PI) * 4);
    ctx.drawImage(b.state === 'used' ? USED : QBLOCK, Math.round(b.x), by);
  }
  for (const it of items) {
    if (it.kind === 'coin') {
      const p = it.t / .6;
      const y = it.y - 40 * Math.sin(p * Math.PI * .9);
      const sx = Math.abs(Math.cos(it.t * 18));
      ctx.save();
      ctx.translate(Math.round(it.x + 4), Math.round(y));
      ctx.scale(Math.max(.15, sx), 1);
      ctx.drawImage(COIN, -4, 0);
      ctx.restore();
    } else {
      const y = it.y - Math.min(1, it.t / .4) * 14;
      ctx.drawImage(MUSH, Math.round(it.x), Math.round(y));
    }
  }
  for (const e of enemies) {
    const set = e.fast ? ENEMY.fast : ENEMY.normal;
    const x = Math.round(e.x), y = Math.round(e.y);
    if (e.state === 'squashed') {
      ctx.drawImage(set.a, x, GROUND - 6, 16, 6);
    } else if (e.state === 'dead') {
      ctx.save(); ctx.translate(x, y + 15); ctx.scale(1, -1); ctx.drawImage(set.a, 0, 0); ctx.restore();
    } else {
      const img = e.state === 'stunned' ? set.a : (Math.floor(e.anim * 6) % 2 ? set.a : set.b);
      const jx = e.state === 'stunned' ? Math.round(Math.sin(clock * 50)) : 0;
      ctx.drawImage(img, x + jx, y);
    }
  }
}

function drawLabels() {
  // locked target last so it sits on top
  const list = targets().sort((a, b) => (a === lock) - (b === lock));
  const single = cfg().maxW === 1;
  for (const t of list) drawLabel(t, t.x + 8, t.y - 4, t.kind === 'block' || single);
}

function wpm() { return playTime > 5 ? Math.round(correct / 5 / (playTime / 60)) : 0; }
function accuracy() { return correct + wrong ? Math.round(100 * correct / (correct + wrong)) : 100; }

function drawHUD() {
  const cols = [['SCORE', String(score).padStart(6, '0'), 12], ['COINS', '×' + String(coins).padStart(2, '0'), 100],
                ['STAGE', `${stage + 1} ${cleared}/${cfg().goal}`, 170], ['LIVES', '♥'.repeat(Math.max(0, Math.min(lives, 5))), 262],
                ['WPM', String(wpm()), 346]];
  for (const [label, val, x] of cols) {
    txt(label, x, 8);
    txt(val, x, 19, label === 'LIVES' ? '#ff5a5a' : '#fff');
  }
  // stage progress bar
  ctx.fillStyle = '#000'; ctx.fillRect(170, 30, 58, 4);
  ctx.fillStyle = '#7cfc00'; ctx.fillRect(171, 31, Math.round(56 * prog()), 2);
  if (combo >= 3 && state === 'playing') txt(`COMBO ×${combo}`, W / 2, 40, '#ffd700', 'center');
}

const RAINBOW = ['#ffd700', '#ff7ab8', '#7cfc00', '#5ad7ff', '#ffa040'];
function drawPraise() {
  if (!praise) return;
  const p = praise.t;
  const size = p < .12 ? 8 : 16;
  const color = RAINBOW[Math.floor(p * 12) % RAINBOW.length];
  txt(praise.text, W / 2, 62 - p * 10, color, 'center', size);
}

function drawPlaque(y) {
  const x = 90, w = 220, h = 78;
  ctx.fillStyle = '#000'; ctx.fillRect(x + 3, y + 3, w, h);
  ctx.fillStyle = '#c84c0c'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#ffb08c'; ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y, 2, h);
  ctx.fillStyle = '#5a1a00'; ctx.fillRect(x, y + h - 2, w, 2); ctx.fillRect(x + w - 2, y, 2, h);
  ctx.fillStyle = '#fcd8a8';
  [[5, 5], [w - 8, 5], [5, h - 8], [w - 8, h - 8]].forEach(([a, b]) => ctx.fillRect(x + a, y + b, 3, 3));
  txt('SUPER', x + 18, y + 12, '#fcd8a8', 'left', 16);
  txt('TYPER', x + w / 2, y + 36, '#fcd8a8', 'center', 28);
}

function overlay(alpha = .55) { ctx.fillStyle = `rgba(0,0,0,${alpha})`; ctx.fillRect(0, 0, W, H); }
const blink = () => Math.floor(clock * 2.5) % 2 === 0;

function statRows(y) {
  const rows = [['SCORE', score], ['BEST', best], ['WPM', wpm()], ['ACCURACY', accuracy() + '%'], ['BEST COMBO', bestCombo]];
  rows.forEach(([k, v], i) => { txt(k, 120, y + i * 13); txt(String(v), 280, y + i * 13, '#ffd700', 'right'); });
}

function draw() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (shake > 0) ctx.translate(Math.round((Math.random() - .5) * 4), Math.round((Math.random() - .5) * 4));

  drawWorld();
  drawEntities();
  drawHero();
  if (state === 'playing' || state === 'paused') drawLabels();
  for (const p of popups) txt(p.text, p.x, p.y - p.t * 22, p.color, 'center');

  if (state === 'title') {
    drawPlaque(16);
    txt(`TOP- ${String(best).padStart(6, '0')}`, W / 2, 102, '#fff', 'center');
    STAGES.forEach((s, i) => txt(`STAGE ${i + 1}: ${s.name}`, W / 2, 120 + i * 12, '#fff', 'center'));
    if (blink()) txt('PRESS ENTER TO START', W / 2, 164, '#ffd700', 'center');
    return;
  }

  drawHUD();
  if (state === 'playing') drawPraise();

  if (banner > 0 && state === 'playing') {
    txt(`STAGE ${stage + 1}`, W / 2, 74, '#fff', 'center', 16);
    txt(cfg().name, W / 2, 96, '#ffd700', 'center');
  }
  if (state === 'paused') {
    overlay();
    txt('PAUSED', W / 2, 88, '#fff', 'center', 16);
    txt('PRESS ESC TO RESUME', W / 2, 116, '#ffd700', 'center');
  }
  if (state === 'clear') {
    overlay(.6);
    txt(`STAGE ${stage + 1} CLEAR!`, W / 2, 50, RAINBOW[Math.floor(clock * 8) % RAINBOW.length], 'center', 16);
    txt('BONUS +1000   EXTRA LIFE!', W / 2, 74, '#7cfc00', 'center');
    txt(`NEXT: ${STAGES[stage + 1].name}`, W / 2, 92, '#fff', 'center');
    txt(`SCORE ${score}   WPM ${wpm()}   ACC ${accuracy()}%`, W / 2, 112, '#fff', 'center');
    if (blink()) txt(`PRESS ENTER FOR STAGE ${stage + 2}`, W / 2, 160, '#ffd700', 'center');
  }
  if (state === 'win') {
    overlay(.6);
    txt('YOU WIN!', W / 2, 44, RAINBOW[Math.floor(clock * 8) % RAINBOW.length], 'center', 16);
    statRows(74);
    if (blink()) txt('PRESS ENTER TO PLAY AGAIN', W / 2, 160, '#ffd700', 'center');
  }
  if (state === 'over') {
    overlay(.7);
    txt('GAME OVER', W / 2, 44, '#fff', 'center', 16);
    txt(`REACHED STAGE ${stage + 1}`, W / 2, 64, '#ffd700', 'center');
    statRows(84);
    if (blink()) txt('PRESS ENTER TO PLAY AGAIN', W / 2, 160, '#ffd700', 'center');
  }
}

// ---------- input ----------
function togglePause() {
  if (state === 'playing') { state = 'paused'; stopMusic(); }
  else if (state === 'paused') { state = 'playing'; startMusic(cfg().tempo); }
  pauseBtn.textContent = state === 'paused' ? 'RESUME' : 'PAUSE';
}

function onEnter() {
  if (state === 'title' || state === 'over' || state === 'win') start();
  else if (state === 'clear') nextStage();
}

kb.addEventListener('input', () => {
  const v = kb.value; kb.value = '';
  ensureAudio();
  for (const ch of v) handleChar(ch);
});

addEventListener('keydown', e => {
  ensureAudio();
  if (e.key === 'Escape') { togglePause(); e.preventDefault(); return; }
  if (e.key === 'Enter') { onEnter(); e.preventDefault(); return; }
  if (e.key === 'Backspace') { releaseLock(); e.preventDefault(); return; }
  if (e.key.length === 1 && !e.metaKey && !e.ctrlKey && document.activeElement !== kb) {
    handleChar(e.key);
    e.preventDefault();
    kb.focus({ preventScroll: true });
  }
});

cv.addEventListener('pointerdown', () => {
  ensureAudio();
  kb.focus({ preventScroll: true });
  onEnter();
});

document.getElementById('homeBtn').addEventListener('click', () => {
  window.location.href = 'https://reubenask.github.io/emerald-hills/platform.html';
});
const musicBtn = document.getElementById('musicBtn');
const sfxBtn = document.getElementById('sfxBtn');
const pauseBtn = document.getElementById('pauseBtn');
musicBtn.addEventListener('click', () => {
  ensureAudio();
  musicOn = !musicOn; musicBtn.textContent = 'MUSIC: ' + (musicOn ? 'ON' : 'OFF');
  if (musicGain) musicGain.gain.value = musicOn ? 1 : 0;
  kb.focus({ preventScroll: true });
});
sfxBtn.addEventListener('click', () => {
  sfxOn = !sfxOn; sfxBtn.textContent = 'SFX: ' + (sfxOn ? 'ON' : 'OFF');
  kb.focus({ preventScroll: true });
});
pauseBtn.addEventListener('click', () => { togglePause(); kb.focus({ preventScroll: true }); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') togglePause();
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

const fontReady = document.fonts ? document.fonts.load(`8px ${FONT}`).catch(() => {}) : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(() => {
  kb.focus({ preventScroll: true });
  requestAnimationFrame(frame);
});
})();
</script>
</body>
