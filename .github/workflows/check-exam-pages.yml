# Daily, and after every change to the test pages: checks each page is connected to marking and that the
# server has marking set up for its exam id. A failed run makes GitHub email the repository owner.
name: Check test pages are connected to marking
on:
  push:
    branches: [main]
    paths: ['monthly-exams/**', 'tools/check_exam_pages.mjs']
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check_exam_pages.mjs
