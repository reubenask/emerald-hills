<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monthly Examination Report</title><style>
:root{--ink:#e9efdf;--gold:#dab977;--deep:#092d24;--line:#caa66c55;--paper:#fcfaf4;--navy:#1a2744}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#175541,#061e19);font:16px/1.6 "Avenir Next","Segoe UI",sans-serif;color:var(--ink)}header,main{max-width:1100px;margin:auto;padding:28px}header{border-bottom:1px solid var(--gold)}h1,h2,h3{font-family:Georgia,serif}h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:400;letter-spacing:.06em;color:var(--gold);margin:8px 0}h2{color:var(--gold)}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:.8rem;color:var(--gold)}button,a.button{display:inline-block;border:1px solid var(--gold);border-radius:6px;background:transparent;color:var(--ink);padding:10px 16px;font:inherit;text-decoration:none;cursor:pointer;margin:5px 8px 5px 0}button:disabled{opacity:.5;cursor:wait}.gold{background:var(--gold);color:var(--deep)}.panel{border:1px solid var(--line);background:#0d392e99;padding:24px;border-radius:12px;margin:24px 0}.identity{display:flex;flex-wrap:wrap;gap:14px 40px}.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px}.score{border:1px solid var(--line);padding:18px;border-radius:8px}.score strong{font:2rem Georgia,serif;display:block;color:var(--gold)}.overall{font:2.4rem Georgia,serif;color:var(--gold)}.muted{color:#c6d6ce}.notice{border-left:4px solid var(--gold);padding:15px;background:#ffffff09}.item{background:var(--paper);color:var(--navy);padding:20px;border-radius:8px;margin:18px 0;break-inside:avoid}.item h3{color:var(--navy)}.correct{border-left:5px solid #2b805c}.incorrect{border-left:5px solid #c85c45}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}audio{width:100%}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #ccc;text-align:left;vertical-align:top}details{margin:12px 0}summary{cursor:pointer;font-weight:bold}.tag{font-weight:bold}.actions{display:flex;flex-wrap:wrap}[hidden],#report[hidden]{display:none!important}@media(max-width:600px){header,main{padding:18px}.panel{padding:16px}table{font-size:.85rem}td,th{padding:5px}}@media print{body{background:white;color:#172f29}header,main{max-width:none;padding:10px}h1,h2,.overall,.score strong{color:#174333}.panel,.score{background:white;border-color:#999;box-shadow:none}.actions,#working,.no-print{display:none!important}.muted{color:#444}.item{background:white;border:1px solid #ccc}.identity{gap:8px 25px}.panel{break-inside:auto}details{display:block}.scoregrid{grid-template-columns:repeat(4,1fr)}audio{display:none}a{color:inherit}}
.teacher-box{margin-top:18px;padding:14px 16px;border:2px solid #b8860b;border-radius:8px;background:#fff8e6}.teacher-box label{display:block;margin:6px 0}.teacher-box input{font:inherit;padding:6px 8px;border:1px solid #b8860b;border-radius:6px;margin-left:6px}.teacher-box input[type=text]{width:min(100%,520px);margin:4px 0 0}.teacher-note{color:#14532d}@media print{.teacher-box{display:none}}</style></head><body><header><div class="eyebrow">Monthly Examination · Personal Feedback</div><h1>EXAM REPORT CARD</h1><p id="identity">Connecting to your private report…</p><div class="actions"><a class="button" href="index.html">Return to Exams</a><button id="refresh">Refresh Report</button><button id="download" disabled>Download Complete Report</button><button id="print" disabled>Print / Save as PDF</button><button id="retry" hidden>Retry Unavailable Marking</button></div></header><main><section id="working" class="panel" role="status">Waiting for your results. Keep this page open while your submitted work is processed. If you close it, return to this report to resume.</section><div id="report" hidden></div></main><script src="shared/cloud-config.js?v=20261018b"></script><script src="shared/cloud-client.js?v=20261018b"></script><script src="shared/report.js?v=20261018c"></script></body></html>
