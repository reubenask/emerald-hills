<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Type Kombat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --gold:#ffd23f; --red:#ff3b3b; --green:#3ee06a; --ice:#8fe3ff; --ink:#0b070d; --panel:rgba(12,8,16,.84); }
  html, body { margin:0; height:100%; background:#07050a; color:#eee; font-family:"Russo One", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:12px; box-sizing:border-box; overflow:hidden; }
  #wrap { position:relative; overflow:hidden; border-radius:10px; box-shadow:0 0 0 2px #3a1218, 0 10px 40px rgba(0,0,0,.6); background:#000; cursor:text; user-select:none; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #ui { position:absolute; inset:0; pointer-events:none; }
  .hidden { display:none !important; }
  .stroke { text-shadow: 0 .08em 0 #000, 0 0 .4em rgba(0,0,0,.8); }

  /* fight HUD */
  #hud { position:absolute; top:2.5%; left:2.5%; right:2.5%; display:grid; grid-template-columns:1fr 6.5em 1fr; align-items:start; gap:1em; }
  .side { display:flex; flex-direction:column; gap:.35em; }
  .side.r { align-items:flex-end; }
  .bar { position:relative; width:100%; height:1.35em; background:#2a0606; border:.14em solid #000; outline:.12em solid var(--gold); border-radius:.25em; overflow:hidden; }
  .bar .trail, .bar .fill { position:absolute; top:0; bottom:0; }
  .side.l .trail, .side.l .fill { left:0; } .side.r .trail, .side.r .fill { right:0; }
  .bar .trail { background:#e02a2a; transition:width .5s ease .25s; }
  .bar .fill { background:linear-gradient(#b8ff7a,#2fbf48 55%,#1f8f34); }
  .bar .fill.low { background:linear-gradient(#ffd27a,#ff7a2a 55%,#c4401a); animation:blink .4s steps(2) infinite; }
  .who { display:flex; align-items:center; gap:.6em; font-size:1.05em; }
  .side.r .who { flex-direction:row-reverse; }
  .wins { display:flex; gap:.3em; }
  .wins i { width:.8em; height:.8em; border-radius:50%; background:#2a1d18; border:.12em solid #000; display:block; }
  .wins i.on { background:radial-gradient(circle at 35% 35%, #fff6b0, var(--gold) 50%, #a77a00); }
  #timerBox { text-align:center; }
  #timer { font-size:3em; line-height:1; color:var(--gold); }
  #timer.low { color:var(--red); }
  #live { font-family:"JetBrains Mono", monospace; font-size:.7em; color:#b9b2c4; margin-top:.3em; }
  .meter { width:12em; height:.55em; background:#14142e; border:.12em solid #000; border-radius:.3em; overflow:hidden; }
  .meter b { display:block; height:100%; background:linear-gradient(90deg,#2d6bff,#7fb2ff); width:0; }
  .meter.full b { background:linear-gradient(90deg,#ffb000,#fff2a0,#ffb000); animation:blink .3s steps(2) infinite; }
  .tag { font-size:.7em; color:#8a86a0; letter-spacing:.08em; }
  .tag.ready { color:var(--gold); }
  #combo { font-size:1.2em; color:#7fd6ff; min-height:1.3em; }
  #score { font-size:.85em; color:var(--gold); }
  #battle { font-size:.65em; color:#9a93a8; }

  /* word panel */
  #panel { position:absolute; left:50%; bottom:3.5%; transform:translateX(-50%); min-width:40%; max-width:92%; background:var(--panel); border:.15em solid var(--gold); border-radius:.6em; padding:.55em 1.3em .7em; display:flex; align-items:center; gap:1.2em; box-shadow:0 .4em 1.4em rgba(0,0,0,.6); }
  #panel.block { border-color:var(--red); box-shadow:0 0 1.6em rgba(255,40,40,.55); }
  #panel.special { border-color:#ff9a1a; box-shadow:0 0 1.6em rgba(255,160,30,.55); }
  #panel.err { animation:shake .2s; }
  #plabel { font-size:.8em; letter-spacing:.12em; color:#a49cb4; width:5.4em; }
  #panel.block #plabel { color:var(--red); animation:blink .25s steps(2) infinite; }
  #panel.special #plabel { color:#ffb03a; }
  #pword { font-family:"JetBrains Mono", monospace; font-weight:800; font-size:2.5em; letter-spacing:.04em; white-space:pre; color:#fff; flex:1; text-align:center; }
  #pword .d { color:var(--green); }
  #pword .c { text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:.15em; text-decoration-thickness:.08em; }
  #panel.block #pword { color:#ff5a5a; } #panel.block #pword .d { color:var(--gold); }
  #panel.special #pword { color:#ffd23f; } #panel.special #pword .d { color:#ff7a1a; }
  #pnext { font-family:"JetBrains Mono", monospace; font-size:.85em; color:#6f6880; text-align:right; width:7em; }
  #pnext b { display:block; font-size:.75em; color:#4f4860; font-family:"Russo One"; letter-spacing:.1em; }
  #ptime { position:absolute; left:8%; right:8%; bottom:.25em; height:.25em; border-radius:.2em; background:rgba(255,255,255,.08); overflow:hidden; }
  #ptime b { display:block; height:100%; background:var(--red); width:100%; }

  /* banner + popups */
  #banner { position:absolute; left:0; right:0; top:30%; text-align:center; }
  #banner .t { font-size:5.4em; line-height:1; background:linear-gradient(#fff7c2,#ffd23f 45%,#c97a00); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 .06em 0 #000) drop-shadow(0 0 .3em rgba(0,0,0,.9)); }
  #banner.red .t { background:linear-gradient(#ffd0d0,#ff3b3b 45%,#8a0000); -webkit-background-clip:text; background-clip:text; }
  #banner .s { font-size:1.3em; color:#fff; margin-top:.4em; }
  #banner.pop { animation:pop .35s cubic-bezier(.2,1.6,.4,1); }
  #fx { position:absolute; inset:0; overflow:hidden; }
  .pp { position:absolute; transform:translate(-50%,-50%); font-size:1.4em; white-space:nowrap; animation:float 1s ease-out forwards; }
  .pp.big { font-size:2em; } .pp.sm { font-size:.95em; }
  #flash { position:absolute; inset:0; opacity:0; }

  /* screens */
  #screen { position:absolute; inset:0; pointer-events:auto; }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .logo1 { font-size:4.2em; color:var(--gold); line-height:1; }
  .logo2 { font-size:6em; line-height:.95; background:linear-gradient(#ffb0b0,#ff2a2a 50%,#7a0000); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 .05em 0 #000); }
  .howto { margin-top:1.2em; font-size:.95em; line-height:1.8; color:#eee; background:rgba(0,0,0,.45); padding:.6em 1.4em; border-radius:.5em; }
  .howto b { color:var(--gold); font-weight:400; }
  .prompt { margin-top:1.2em; font-size:1.3em; animation:blink 1s steps(2) infinite; }
  .muted { color:#9a93a8; font-size:.8em; margin-top:.6em; }
  .selTitle { position:absolute; top:4%; left:0; right:0; text-align:center; font-size:2em; color:var(--gold); }
  .cards { position:absolute; bottom:5%; left:0; right:0; display:flex; justify-content:center; gap:1em; }
  .card { width:6.6em; border-radius:.5em; overflow:hidden; background:#140c16; border:.18em solid #3a2a34; cursor:pointer; text-align:center; transition:transform .15s, border-color .15s; }
  .card img { display:block; width:100%; aspect-ratio:4/5; object-fit:cover; }
  .card span { display:block; font-size:.75em; padding:.3em 0; }
  .card.on { border-color:var(--gold); transform:translateY(-.5em) scale(1.08); box-shadow:0 0 1.2em rgba(255,210,63,.5); }
  .info { position:absolute; right:5%; top:15%; width:32%; background:var(--panel); border-radius:.6em; padding:1em 1.3em; border:.12em solid #3a2a34; }
  .info h2 { margin:0; font-size:2.4em; font-weight:400; }
  .info .st { color:var(--gold); font-size:.95em; margin-top:.2em; }
  .info .ds { color:#bbb; font-size:.8em; margin:.5em 0 .8em; }
  .stat { display:flex; align-items:center; gap:.6em; font-size:.75em; margin:.35em 0; color:#aaa; }
  .stat span { width:5.5em; } .stat i { flex:1; height:.7em; background:#2a2030; border-radius:.3em; overflow:hidden; display:block; }
  .stat i b { display:block; height:100%; background:linear-gradient(90deg,#ffb000,#ffe27a); }
  .info .sp { margin-top:.6em; font-size:.8em; color:#ff9a3a; }
  .info .sp code { font-family:"JetBrains Mono", monospace; color:#fff; background:#2a1a10; padding:.1em .4em; border-radius:.3em; }
  .hint { position:absolute; left:0; right:0; bottom:.8%; text-align:center; font-size:.7em; color:#9a93a8; }
  .vs { position:absolute; left:0; right:0; bottom:8%; display:flex; align-items:flex-end; justify-content:space-between; padding:0 8%; }
  .vsSide { text-align:center; width:27%; }
  .vsSide img { width:100%; border-radius:.6em; border:.2em solid var(--gold); box-shadow:0 0 2em rgba(0,0,0,.8); }
  .vsSide.e img { border-color:var(--red); }
  .vsSide h3 { margin:0; font-weight:400; font-size:2.6em; color:var(--gold); } .vsSide.e h3 { color:#ff6a6a; }
  .vsMid { align-self:center; margin-bottom:12%; font-size:6em; color:var(--red); filter:drop-shadow(0 .05em 0 #000); }
  .vsTop { position:absolute; top:5%; left:0; right:0; text-align:center; color:#ccc; font-size:1.1em; }
  .slideL { animation:slideL .5s ease-out; } .slideR { animation:slideR .5s ease-out; }
  .stats { background:var(--panel); border-radius:.6em; padding:1em 2em; margin-top:1em; min-width:22em; }
  .stats div { display:flex; justify-content:space-between; font-size:1em; margin:.35em 0; color:#aaa; }
  .stats div b { color:#fff; font-weight:400; font-family:"JetBrains Mono", monospace; }
  .rank { font-size:2.4em; color:var(--gold); margin-top:.4em; }
  .big { font-size:4em; }

  @keyframes blink { 50% { opacity:.35; } }
  @keyframes pop { from { transform:scale(2.2); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes float { 0% { opacity:0; margin-top:.6em; } 15% { opacity:1; } 100% { opacity:0; margin-top:-2.4em; } }
  @keyframes shake { 25% { transform:translateX(calc(-50% - .3em)); } 75% { transform:translateX(calc(-50% + .3em)); } }
  @keyframes slideL { from { transform:translateX(-60%); opacity:0; } }
  @keyframes slideR { from { transform:translateX(60%); opacity:0; } }

  .btns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; font-size:12px; color:#8a8494; }
  button { font:inherit; font-size:12px; color:#eee; background:#241a28; border:1px solid #000; border-radius:6px; padding:8px 12px; cursor:pointer; }
  button:hover { background:#3a2a40; }
  #kb { position:fixed; left:0; top:0; width:1px; height:1px; opacity:0; font-size:16px; border:0; padding:0; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#888; font-size:1.2em; }
</style>
</head>

</div>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);

const rnd = (a, b) => a + Math.random() * (b - a);

const setText = (el, s) => { if (el._t !== s) { el._t = s; el.textContent = s; } };

const show = (el, on) => el.classList.toggle('hidden', !on);
const ROUND_TIME = 60;

// ---------- words ----------
const T1 = `jab hit kick duck dodge fist palm chop fury rage claw fang bite clan duel fire ice bolt rock wind wave storm iron steel gold jade moon sun star dark light bold brave fast quick swift calm focus power heart mind soul will grit sword blade spear bow staff fan shield arrow skull bone flame smoke ash dust sand snow rain fog mist cave tomb gate wall tower king queen lord monk ninja tiger crane snake dragon eagle wolf bear hawk lion fox bull frog spin flip jump roll leap rush dash grab throw slam block guard parry stomp crush smash break shake`.split(/\s+/);
const T2 = `combat fighter warrior battle shadow thunder lightning tornado volcano glacier blizzard phoenix serpent scorpion temple shrine arena kombat master student honor courage victory defeat fatal mortal ancient legend mystic portal realm empire throne champion tournament challenge strength balance spirit energy uppercut roundhouse sweep counter combo special finish brutal savage silent hidden frozen burning electric venom poison crystal emerald crimson golden silver obsidian`.split(/\s+/);
const T3 = `invincible unstoppable lightning devastating tournament annihilate thunderbolt earthquake whirlwind hurricane spectacular legendary relentless fearless explosive meditation discipline concentrate determined powerful knowledge perfection excellent magnificent`.split(/\s+/);
const PHRASES = ['iron fist', 'dragon kick', 'flying knee', 'tiger claw', 'storm punch', 'shadow step', 'crane wing', 'rising sun', 'spinning heel', 'thunder palm', 'never give up', 'fight with honor', 'stay focused'];
const BLOCKW = T1.filter(w => w.length >= 3 && w.length <= 6);

// ---------- fighters ----------
const ROSTER = [
  { name: 'BLAZE', style: 'Fire Ninja', desc: 'Balanced all-rounder. Good at everything.',
    gi: '#c42a1a', pants: '#3a0c08', trim: '#ffb000', skin: '#d9a07a', mask: '#7a1208', glove: '#2a1410', eye: '#ffcf4a', proj: '#ff6a00', look: 'ninja',
    hp: 100, pow: 1.0, spdK: 1.0, blockBonus: 0, meterK: 1.0, special: 'dragon fire', finisher: 'burn to ashes', bars: [3, 3, 3, 3] },
  { name: 'FROST', style: 'Ice Ninja', desc: 'Extra time to type block words.',

    hp: 100, pow: 0.9, spdK: 0.95, blockBonus: 0.6, meterK: 1.0, special: 'ice storm', finisher: 'frozen shatter', bars: [3, 2, 3, 5] },
  { name: 'VOLT', style: 'Thunder Monk', desc: 'Typing speed turns into huge damage.',

  { name: 'VIPER', style: 'Jade Assassin', desc: 'Special meter fills much faster.',
    gi: '#179a48', pants: '#0a3a1c', trim: '#d4ff6a', skin: '#e0b088', mask: '#0b4a24', glove: '#0a3a1c', eye: '#d4ff6a', proj: '#6aff4a', look: 'ninja',
    hp: 95, pow: 0.95, spdK: 1.0, blockBonus: 0.2, meterK: 1.6, special: 'venom strike', finisher: 'poison kiss', bars: [3, 3, 3, 3] },

    hp: 130, pow: 1.25, spdK: 0.7, blockBonus: -0.2, meterK: 0.8, special: 'boulder smash', finisher: 'crushed to dust', bars: [5, 5, 1, 2] },
];
const BOSS = { name: 'WARLORD', style: 'Emperor of the Realm', desc: 'Final boss.',
  gi: '#4a1670', pants: '#1c0828', trim: '#e8b830', skin: '#b07850', mask: null, glove: '#e8b830', eye: '#ff3030', proj: '#c060ff', look: 'warlord', bulk: 1.18, size: 1.15,
  hp: 150, pow: 1.3 };
const AI = [
  { gap: [5.0, 7.0], win: 3.4, dmg: 8,  armor: 0,   blk: [3, 4] },
  { gap: [4.2, 6.0], win: 3.0, dmg: 10, armor: .05, blk: [3, 5] },
  { gap: [3.6, 5.0], win: 2.6, dmg: 12, armor: .1,  blk: [4, 5] },
  { gap: [3.0, 4.4], win: 2.2, dmg: 14, armor: .15, blk: [4, 6] },
  { gap: [2.5, 3.6], win: 1.9, dmg: 16, armor: .2,  blk: [5, 6] },
];

// ---------- audio ----------
let ac = null, musicGain = null, noiseBuf = null, musicOn = true, sfxOn = true;
function ensureAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      musicGain = ac.createGain();
      musicGain.gain.value = musicOn ? 1 : 0;
      musicGain.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      startMusic();
    } catch (e) {}
  }
  if (ac && ac.state === 'suspended') ac.resume();

const mtof = m => 440 * 2 ** ((m - 69) / 12);
function playNote(dest, f0, f1, t, dur, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(dest);
  o.start(t); o.stop(t + dur + .02);
}
function playNoise(dest, t, dur, vol, freq, ftype) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);

  s.start(t, Math.random() * .5); s.stop(t + dur + .02);

function tone(f0, f1, dur, type = 'square', vol = .06, delay = 0) {
  if (!ac || !sfxOn) return;
  playNote(ac.destination, f0, f1, ac.currentTime + delay, dur, type, vol);
}
function noise(dur, vol, freq, ftype = 'lowpass', delay = 0) {
  if (!ac || !sfxOn) return;
  playNoise(ac.destination, ac.currentTime + delay, dur, vol, freq, ftype);
}
const SFX = {
  key: () => tone(1400, 0, .02, 'square', .015),
  wrong: () => tone(120, 80, .14, 'sawtooth', .07),
  whoosh: () => noise(.12, .12, 2500, 'highpass'),
  hit: big => { noise(big ? .25 : .14, big ? .5 : .32, 900); tone(big ? 180 : 160, 50, big ? .2 : .12, 'square', .1); },
  block: () => { tone(1800, 1200, .08, 'triangle', .08); noise(.06, .2, 4000, 'highpass'); },
  special: () => { tone(180, 900, .35, 'sawtooth', .07); noise(.4, .2, 1500, 'bandpass'); },
  boom: () => { noise(.8, .6, 400); tone(90, 30, .8, 'sine', .3); },
  alarm: () => { tone(880, 0, .06, 'square', .05); tone(660, 0, .06, 'square', .05, .08); },
  select: () => tone(660, 990, .08, 'square', .05),

function say(text) {
  if (!sfxOn || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.pitch = .2; u.rate = .8; u.volume = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const BASS = [45, 45, 57, 45, 48, 45, 52, 45, 43, 43, 55, 43, 47, 43, 50, 52];
const music = { step: 0, next: 0, timer: null };
function startMusic() {
  if (music.timer || !ac) return;
  music.next = ac.currentTime + .1; music.step = 0;
  music.timer = setInterval(scheduleMusic, 25);
}
function scheduleMusic() {
  const spb = 60 / 132 / 2;
  while (music.next < ac.currentTime + .12) {
    const t = music.next, s = music.step % 16;

  g.add(new THREE.Mesh(new THREE.SphereGeometry(.22, 16, 12), new THREE.MeshBasicMaterial({ color })));

// ---------- game state ----------

const P_X = -1.55, E_X = 1.55;
function freshStats() { return { correct: 0, wrong: 0, time: 0, words: 0, maxCombo: 0, blocks: 0, blockTries: 0, fatalities: 0, flawless: 0 }; }

const showcase = new Map();

const stageModels = new Set();

function genWord() {

}

// ---------- flow ----------
function goTitle() {
  state = 'title'; stateT = 0;
  const a = getShowcase(ROSTER[0]), b = getShowcase(ROSTER[1]);
  placeModels([a, b]);
  a.root.position.set(-1.5, 0, 0); a.root.rotation.y = Math.PI / 2 - .3;
  b.root.position.set(1.5, 0, 0); b.root.rotation.y = -(Math.PI / 2 - .3);

}
function goSelect() {
  state = 'select'; stateT = 0;
  placeModels([]);
  renderScreen();
}
function startRun() {
  chosen = ROSTER[sel];
  ladder = [...shuffle(ROSTER.filter(r => r !== chosen)), BOSS];
  stage = 0; score = 0; stats = freshStats();
  startMatch();
}
function startMatch() {
  ai = AI[Math.min(stage, AI.length - 1)];
  player = makeFighter(chosen, P_X, 1);
  enemy = makeFighter(ladder[stage], E_X, -1);
  placeModels([player.model, enemy.model]);
  round = 1; meter = 0;
  state = 'vs'; stateT = 0; timers.length = 0; banner = null; bannerEl.className = 'hidden';
  clearFx();

}
function clearFx() {

}
function startRound() {
  timers.length = 0; clearFx();
  for (const f of [player, enemy]) { f.hp = f.maxHp; f.x = f.baseX; f.anim = null; f.pose = 'idle'; f.off = 0; f.gone = false; f.model.root.visible = true; }
  roundTime = ROUND_TIME; combo = 0; block = null; finishW = null;
  nextWord = genWord(); attack = null; newAttack();
  aiTimer = rnd(...ai.gap) + 1;

  renderScreen();

  say(final ? 'Final round' : `Round ${round}`);

}
function roundOver(winner, reason) {

  const flawless = winner === 'player' && player.hp === player.maxHp;
  if (winner === 'player') player.wins++;
  if (winner === 'enemy') enemy.wins++;
  if (flawless) { score += 2000; stats.flawless++; }
  if (winner === 'player' && player.wins >= 2 && reason !== 'time') { startFinish(flawless); return; }
  state = 'ko'; stateT = 0;
  const w = winner === 'player' ? player : winner === 'enemy' ? enemy : null;
  const l = w === player ? enemy : w === enemy ? player : null;
  if (l) { l.anim = null; l.pose = reason === 'time' ? 'dazed' : 'ko'; }
  if (w) { w.anim = null; w.pose = 'win'; }
  showBanner(reason === 'time' ? 'TIME!' : 'K.O.', 'red', '', 1.3);
  if (reason !== 'time') { SFX.boom(); shake = .25; }
  after(1.4, () => {
    if (!w) { showBanner('DRAW', 'gold', '', 2); say('Draw'); return; }
    showBanner(`${w.def.name} WINS`, w === player ? 'gold' : 'red', flawless ? 'FLAWLESS VICTORY  +2000' : '', 2.2);
    say(flawless ? 'Flawless victory' : `${w.def.name.toLowerCase()} wins`);
  });
  after(3.8, () => {

}
function startFinish(flawless) {
  state = 'finish'; stateT = 0;
  enemy.anim = null; enemy.pose = 'dazed'; player.anim = null; player.pose = 'idle';

}
function finisherDone(success) {

// ---------- combat ----------
function handleChar(ch) {
  if (paused) return;
  if (state === 'select') {
    const n = +ch;
    if (n >= 1 && n <= ROSTER.length) { sel = n - 1; SFX.select(); renderScreen(); }
    return;
  }
  let tgt;
  if (state === 'finish') tgt = finishW;
  else if (state === 'fight') tgt = block || attack;
  else return;
  if (!tgt) return;
  ch = ch.toLowerCase();
  if (ch === tgt.text[tgt.pos]) {
    tgt.pos++; stats.correct++;
    if (tgt === attack) { if (attack.t0 === null) attack.t0 = clock; attack.n++; }
    SFX.key();
    if (tgt.pos >= tgt.text.length) {
      if (tgt === block) blockSuccess();
      else if (tgt === attack) strike(attack);
      else finisherDone(true);
    }
  } else {
    tgt.err++; stats.wrong++;
    if (combo >= 3) popup('COMBO BROKEN', headPos(player), '#ff6060', 'sm');
    combo = 0; errFlash = .2;
    SFX.wrong();
  }
}
function strike(a) {
  const def = player.def, len = a.text.length;
  const dt = Math.max(.08, clock - a.t0);
  const wpmW = a.n >= 2 ? (a.n - 1) / dt * 12 : 40;
  const sm = clamp(Math.pow(wpmW / 40, def.spdK), .5, 2.4);
  const clean = a.err === 0;
  if (clean) { combo++; stats.maxCombo = Math.max(stats.maxCombo, combo); }
  let dmg, move;
  if (a.special) {
    meter = 0;
    dmg = (20 + len * .8) * def.pow * clamp(sm, .8, 1.6) * (clean ? 1.2 : 1);
    move = 'special';
  } else {
    if (clean) meter = Math.min(100, meter + 10 * def.meterK + (sm >= 1.5 ? 4 : 0));
    dmg = (2 + len * .9) * sm * (clean ? 1.2 : 1) * (1 + Math.min(combo, 10) * .05) * def.pow;
    move = sm >= 1.6 ? 'upper' : len >= 7 ? 'kick' : 'punch';
  }
  dmg = Math.max(1, Math.round(dmg * (1 - ai.armor)));
  const label = sm >= 2 ? 'BLAZING!' : sm >= 1.5 ? 'FAST!' : sm < .75 ? 'SLOW…' : '';
  stats.words++;
  newAttack();
  if (meter >= 100 && !a.special && !attack.special) popup('SPECIAL READY!', headPos(player), '#ffd23f', 'sm');
  if (move === 'special') {
    setAnim(player, 'special', .45); SFX.special();
    launchProjectile(hitPos(player).add(new THREE.Vector3(.5, 0, 0)), hitPos(enemy), def.proj, () => hitEnemy(dmg, true, 'SPECIAL!'));
  } else {
    setAnim(player, move, .3); SFX.whoosh();
    after(.13, () => hitEnemy(dmg, move !== 'punch', label));
  }
}
function hitEnemy(dmg, big, label) {
  if (state !== 'fight') return;
  enemy.hp = Math.max(0, enemy.hp - dmg);
  setAnim(enemy, 'hit', .3);
  sparks(hitPos(enemy), big ? player.def.proj : '#ffd23f', big ? 26 : 14);
  popup(`-${dmg}`, headPos(enemy), '#fff', big ? 'big' : '');
  if (label) popup(label, headPos(enemy).add(new THREE.Vector3(0, .5, 0)), label.startsWith('SLOW') ? '#9a93a8' : '#ffd23f', 'sm');
  if (combo >= 2) popup(`${combo} HIT COMBO`, headPos(player).add(new THREE.Vector3(-.3, .3, 0)), '#7fd6ff', 'sm');
  score += Math.round(dmg * 10 * (1 + Math.min(combo, 10) * .1));
  shake = Math.max(shake, big ? .18 : .08);
  SFX.hit(big);
  if (enemy.hp <= 0) roundOver('player', 'ko');
}
function startBlock() {
  const [lo, hi] = ai.blk;
  let w; do { w = pick(BLOCKW); } while (w.length < lo || w.length > hi);
  const dur = Math.max(1.2, ai.win + (player.def.blockBonus || 0));
  block = { text: w, pos: 0, err: 0, t: 0, dur };
  attack.t0 = null; attack.n = 0;
  stats.blockTries++;
  SFX.alarm();
}
function blockSuccess() {
  block = null; stats.blocks++;
  setAnim(player, 'block', .4);
  setAnim(enemy, Math.random() < .5 ? 'punch' : 'kick', .28);
  SFX.block();
  sparks(hitPos(player).add(new THREE.Vector3(.3, .2, 0)), '#8fe3ff', 12);
  popup('BLOCKED!', headPos(player), '#8fe3ff');
  meter = Math.min(100, meter + 15 * (player.def.meterK || 1));
  aiTimer = rnd(...ai.gap);
  after(.22, () => {
    if (state !== 'fight') return;
    popup('COUNTER', headPos(enemy).add(new THREE.Vector3(0, .5, 0)), '#ffd23f', 'sm');
    hitEnemy(Math.max(1, Math.round(3 * player.def.pow)), false, '');
  });
}
function enemyStrike() {
  block = null;
  const mv = Math.random() < .5 ? 'punch' : 'kick';
  setAnim(enemy, mv, .3); SFX.whoosh();
  aiTimer = rnd(...ai.gap);
  after(.13, () => {
    if (state !== 'fight') return;
    const dmg = Math.round(ai.dmg * (.85 + .15 * (enemy.def.pow || 1)) * rnd(.9, 1.1));
    player.hp = Math.max(0, player.hp - dmg);
    setAnim(player, 'hit', .32);
    if (combo >= 3) popup('COMBO BROKEN', headPos(player).add(new THREE.Vector3(0, .5, 0)), '#ff6060', 'sm');
    combo = 0;
    sparks(hitPos(player), '#ff4040', 16);
    popup(`-${dmg}`, headPos(player), '#ff6060', 'big');
    shake = .2; flash('#ff0000');
    SFX.hit(true);
    if (player.hp <= 0) roundOver('enemy', 'ko');
  });
}

// ---------- update ----------
function updateFighter(f, dt) {
  if (f.anim) { f.anim.t += dt; if (f.anim.t >= f.anim.dur) f.anim = null; }
  let off = 0, target;
  if (f.anim) {
    const p = f.anim.t / f.anim.dur, s = Math.sin(p * Math.PI), n = f.anim.name;
    if (n === 'punch' || n === 'upper') off = s * 1.2;
    else if (n === 'kick') off = s * .95;
    else if (n === 'hit') off = -s * .4;
    else if (n === 'block') off = -s * .15;
    target = STRIKES.has(n) ? poseFor(n, Math.min(1, s * 1.6)) : poseFor(n);
  } else {
    target = poseFor(block && f === enemy && state === 'fight' ? 'windup' : f.pose);
  }
  if (!f.anim && f.pose === 'idle') { target.spine.x += Math.sin(clock * 3 + f.dir) * .03; target.hipsY += Math.sin(clock * 3 + f.dir) * .015; }
  if (!f.anim && f.pose === 'dazed') target.spine.z = Math.sin(clock * 2.2) * .18;
  f.off = off;
  const m = f.model;
  m.root.position.set(f.x + off * f.dir, 0, 0);
  m.root.rotation.y = f.dir * (Math.PI / 2 - .3);
  animateModel(m, target, dt, f.anim ? 26 : 12, f.pose === 'ko' && !f.anim ? 1 : 0);
}
function update(dt) {
  clock += dt; stateT += dt;
  for (let i = 0; i < timers.length; i++) {
    const tm = timers[i];
    tm.t -= dt;
    if (tm.t <= 0) { timers.splice(i--, 1); tm.fn(); }
  }
  if (player && !['title', 'select'].includes(state)) { updateFighter(player, dt); updateFighter(enemy, dt); }

  if (state === 'fight') {
    stats.time += dt;
    roundTime -= dt;
    if (block) {
      block.t += dt;
      if (block.t >= block.dur) enemyStrike();
    } else if (!enemy.anim || enemy.anim.name === 'hit') {
      aiTimer -= dt;
      if (aiTimer <= 0) startBlock();
    }
    if (roundTime <= 0) {
      roundTime = 0;
      const pp = player.hp / player.maxHp, ep = enemy.hp / enemy.maxHp;
      roundOver(pp > ep ? 'player' : ep > pp ? 'enemy' : 'draw', 'time');
    }
  } else if (state === 'finish') {
    finishW.t += dt;
    if (finishW.t >= finishW.dur) finisherDone(false);
  }

  for (let i = projs.length - 1; i >= 0; i--) {
    const p = projs[i];
    p.t += dt;
    p.g.position.lerpVectors(p.from, p.to, Math.min(1, p.t / p.dur));
    if (Math.random() < .9) sparks(p.g.position, p.color, 1);
    if (p.t >= p.dur) { scene.remove(p.g); projs.splice(i, 1); p.onHit(); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    p.v.y -= p.g * dt;
    p.m.position.addScaledVector(p.v, dt);
    if (p.spin) { p.m.rotation.x += p.spin * dt; p.m.rotation.y += p.spin * dt; }
    if (p.floor && p.m.position.y < .055) { p.m.position.y = .055; p.v.y *= -.3; p.v.x *= .6; p.v.z *= .6; p.spin *= .5; }
    if (!p.floor) p.m.scale.setScalar(Math.max(.01, 1 - p.t / p.life));
    if (p.t >= p.life) { fxGroup.remove(p.m); p.m.material.dispose(); parts.splice(i, 1); }
  }
  if (banner) { banner.t += dt; if (banner.t > banner.life) { banner = null; bannerEl.className = 'hidden'; } }
  shake = Math.max(0, shake - dt * .8);
  flashT = Math.max(0, flashT - dt);
  errFlash = Math.max(0, errFlash - dt);
  for (const t of torches) { const k = .8 + Math.random() * .4; t.userData.light.intensity = 6 * k; t.userData.flame.scale.set(1, k, 1); }

  if (state === 'title') {
    for (const h of stageModels) { const p = poseFor('idle'); p.spine.x += Math.sin(clock * 3) * .03; animateModel(h, p, dt, 10); }
  } else if (state === 'select') {
    const h = getShowcase(ROSTER[sel]);
    if (!stageModels.has(h)) { placeModels([h]); h.root.position.set(-1.7, 0, .3); }
    h.root.rotation.y = .4 + Math.sin(clock * .8) * .5;
    const p = poseFor('idle'); p.spine.x += Math.sin(clock * 3) * .03;
    animateModel(h, p, dt, 10);
  }
  updateCamera(dt);
}
function updateCamera(dt) {
  if (state === 'title') { camPosT.set(Math.sin(clock * .2) * 1.2, 1.7, 6.4); camLookT.set(0, 1.2, 0); }
  else if (state === 'select') { camPosT.set(-.5, 1.5, 4.8); camLookT.set(-.5, 1.2, 0); }
  else if (state === 'vs') { camPosT.set(0, 1.6, 5.6 - Math.min(1, stateT / 3) * .6); camLookT.set(0, 1.3, 0); }
  else if (state === 'finish' || state === 'matchend') { camPosT.set(enemy.x * .4, 1.6, 5.4); camLookT.set(enemy.x * .4, 1.2, 0); }
  else { camPosT.set(0, 1.8, 6.8); camLookT.set(0, 1.15, 0); }
  const k = 1 - Math.exp(-dt * 3);
  camPos.lerp(camPosT, k); camLook.lerp(camLookT, k);
  camera.position.copy(camPos);
  if (shake) camera.position.add(new THREE.Vector3(rnd(-shake, shake), rnd(-shake, shake), 0));
  camera.lookAt(camLook);
}

// ---------- UI ----------
const ui = {
  hud: $('hud'), panel: $('panel'), pFill: $('pFill'), pTrail: $('pTrail'), eFill: $('eFill'), eTrail: $('eTrail'),
  pName: $('pName'), eName: $('eName'), pWins: $('pWins'), eWins: $('eWins'), timer: $('timer'), live: $('live'),
  meter: $('meter'), meterFill: $('meterFill'), meterTag: $('meterTag'), combo: $('combo'), score: $('score'), battle: $('battle'),
  plabel: $('plabel'), pword: $('pword'), pnext: $('pnext'), ptime: $('ptime'), ptimeFill: $('ptimeFill'), flash: $('flash'),
};
function overallWpm() { return stats && stats.time > 3 ? Math.round(stats.correct / 5 / (stats.time / 60)) : 0; }
function accuracy() { return stats && stats.correct + stats.wrong ? Math.round(100 * stats.correct / (stats.correct + stats.wrong)) : 100; }
function grade() { const g = overallWpm() * (accuracy() / 100) ** 2; return g >= 60 ? 'S' : g >= 45 ? 'A' : g >= 30 ? 'B' : g >= 18 ? 'C' : 'D'; }
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
function wordHTML(text, pos) {
  const t = text.replace(/ /g, '·');
  return `<span class="d">${esc(t.slice(0, pos))}</span><span class="c">${esc(t.slice(pos, pos + 1))}</span>${esc(t.slice(pos + 1))}`;
}
function setBar(fill, trail, f) {
  const pct = Math.max(0, f.hp / f.maxHp * 100) + '%';
  if (fill._w !== pct) { fill._w = pct; fill.style.width = pct; trail.style.width = pct; }
  fill.classList.toggle('low', f.hp / f.maxHp < .25);
}
function setWins(el, n) { [...el.children].forEach((c, i) => c.classList.toggle('on', i < n)); }
function renderUI() {
  const fighting = ['intro', 'fight', 'ko', 'finish', 'matchend'].includes(state);
  show(ui.hud, fighting);
  if (fighting) {
    setBar(ui.pFill, ui.pTrail, player); setBar(ui.eFill, ui.eTrail, enemy);
    setText(ui.pName, player.def.name); setText(ui.eName, enemy.def.name);
    setWins(ui.pWins, player.wins); setWins(ui.eWins, enemy.wins);
    const t = Math.ceil(roundTime);
    setText(ui.timer, String(t)); ui.timer.classList.toggle('low', t <= 10 && state === 'fight');
    setText(ui.live, `${overallWpm()} WPM · ${accuracy()}%`);
    ui.meterFill.style.width = meter + '%';
    ui.meter.classList.toggle('full', meter >= 100);
    setText(ui.meterTag, meter >= 100 ? 'SPECIAL READY!' : 'SPECIAL'); ui.meterTag.classList.toggle('ready', meter >= 100);
    setText(ui.combo, combo >= 2 ? `${combo} HIT COMBO` : '');
    setText(ui.score, `SCORE ${score}`);
    setText(ui.battle, `BATTLE ${stage + 1} / ${ladder.length}`);
  }
  const panelOn = ((state === 'fight' || state === 'intro') && attack) || state === 'finish';
  show(ui.panel, !!panelOn);
  if (panelOn) {
    let mode = '', label, word, pos, next = '', timeK = null;
    if (state === 'finish') { mode = 'block'; label = 'FINISH'; word = finishW.text; pos = finishW.pos; timeK = 1 - finishW.t / finishW.dur; }
    else if (block) { mode = 'block'; label = 'BLOCK!'; word = block.text; pos = block.pos; timeK = 1 - block.t / block.dur; next = `<b>THEN</b>${esc(attack.text)}`; }
    else { mode = attack.special ? 'special' : ''; label = attack.special ? 'SPECIAL' : 'ATTACK'; word = attack.text; pos = attack.pos; next = attack.special ? '' : `<b>NEXT</b>${esc(nextWord)}`; }
    const cls = mode + (errFlash > .1 ? ' err' : '');
    if (ui.panel._c !== cls) { ui.panel._c = cls; ui.panel.className = cls; }
    setText(ui.plabel, label);
    setHTML(ui.pword, wordHTML(word, pos));
    setHTML(ui.pnext, next);
    show(ui.ptime, timeK !== null);
    if (timeK !== null) ui.ptimeFill.style.width = clamp(timeK, 0, 1) * 100 + '%';
  }
  ui.flash.style.opacity = flashT > 0 ? flashT * 1.2 : 0;
  ui.flash.style.background = flashColor;
}
function statsHTML() {
  return `<div class="stats">
    <div>Speed <b>${overallWpm()} WPM</b></div><div>Accuracy <b>${accuracy()}%</b></div>
    <div>Max combo <b>${stats.maxCombo}</b></div><div>Blocks <b>${stats.blocks}/${stats.blockTries}</b></div>
    <div>Fatalities <b>${stats.fatalities}</b></div><div>Score <b>${score}</b></div>
    <div class="rank" style="justify-content:center">RANK ${grade()}</div></div>`;
}
function renderScreen() {
  let h = '';
  if (state === 'title') {
    h = `<div class="center"><div class="logo1 stroke">TYPE</div><div class="logo2">KOMBAT</div>
      <div class="howto">Type words to <b>attack</b> · Faster typing = <b>harder hits</b><br>No mistakes = <b>combos</b> · Red word? Type it to <b>block!</b></div>
      <div class="prompt stroke">PRESS ENTER</div>${best ? `<div class="muted">Best score ${best}</div>` : ''}</div>`;
  } else if (state === 'select') {
    const d = ROSTER[sel];
    h = `<div class="selTitle stroke">CHOOSE YOUR FIGHTER</div>
      <div class="info"><h2>${d.name}</h2><div class="st">${d.style}</div><div class="ds">${d.desc}</div>
      ${['Health', 'Power', 'Speed', 'Block'].map((k, i) => `<div class="stat"><span>${k}</span><i><b style="width:${d.bars[i] * 20}%"></b></i></div>`).join('')}
      <div class="sp">Special: <code>${d.special}</code></div><div class="sp">Finisher: <code>${d.finisher}</code></div></div>
      <div class="cards">${ROSTER.map((r, i) => `<div class="card${i === sel ? ' on' : ''}" data-i="${i}"><img src="${portraits.get(r)}" alt="${r.name}"><span>${i + 1}. ${r.name}</span></div>`).join('')}</div>
      <div class="hint">← → or 1–5 to choose · ENTER to fight · click a card</div>`;
  } else if (state === 'vs') {
    h = `<div class="vsTop stroke">BATTLE ${stage + 1} OF ${ladder.length}${enemy.def === BOSS ? ' — FINAL BOSS' : ''}</div>
      <div class="vs"><div class="vsSide slideL"><h3 class="stroke">${player.def.name}</h3><div class="muted">${player.def.style}</div></div>
      <div class="vsMid">VS</div>
      <div class="vsSide e slideR"><h3 class="stroke">${enemy.def.name}</h3><div class="muted">${enemy.def.style}</div></div></div>
      <div class="hint">ENTER to skip</div>`;
  } else if (state === 'gameover') {
    h = `<div class="center" style="background:rgba(0,0,0,.6)"><div class="big stroke" style="color:var(--red)">GAME OVER</div>${statsHTML()}
      <div class="prompt stroke">ENTER = CONTINUE</div><div class="muted">ESC = choose a new fighter</div></div>`;
  } else if (state === 'champion') {
    h = `<div class="center" style="background:rgba(0,0,0,.55)"><div class="big stroke" style="color:var(--gold)">CHAMPION!</div>
      <div class="muted">${player.def.name} rules the realm</div>${statsHTML()}${score >= best ? '<div class="muted" style="color:var(--green)">NEW BEST!</div>' : ''}
      <div class="prompt stroke">PRESS ENTER</div></div>`;
  }
  if (paused) h += `<div class="center" style="background:rgba(0,0,0,.6)"><div class="big stroke" style="color:var(--gold)">PAUSED</div><div class="prompt">ESC TO RESUME</div></div>`;
  screenEl.innerHTML = h;
  screenEl.style.pointerEvents = h ? 'auto' : 'none';
}

// ---------- input ----------
function onEnter() {
  if (paused) return;
  if (state === 'title') { goSelect(); SFX.select(); }
  else if (state === 'select') { SFX.select(); startRun(); }
  else if (state === 'vs') { timers.length = 0; startRound(); }
  else if (state === 'gameover') { score = Math.floor(score / 2); startMatch(); }
  else if (state === 'champion') goTitle();
}
function togglePause() {
  if (!['intro', 'fight', 'finish'].includes(state)) return;
  paused = !paused;
  pauseBtn.textContent = paused ? 'RESUME' : 'PAUSE';
  if (musicGain) musicGain.gain.value = musicOn && !paused ? 1 : 0;
  renderScreen();
}
function onEsc() {
  if (state === 'gameover' || state === 'champion') { goSelect(); return; }
  if (state === 'select') { goTitle(); return; }
  togglePause();
}
function moveSel(d) {
  if (state !== 'select') return;
  sel = (sel + d + ROSTER.length) % ROSTER.length; SFX.select(); renderScreen();
}
kb.addEventListener('input', () => {
  const v = kb.value; kb.value = '';
  ensureAudio();
  for (const ch of v) handleChar(ch);
});
addEventListener('keydown', e => {
  ensureAudio();
  if (e.key === 'Escape') { onEsc(); e.preventDefault(); return; }
  if (e.key === 'Enter') { onEnter(); e.preventDefault(); return; }
  if (e.key === 'ArrowLeft') { moveSel(-1); e.preventDefault(); return; }
  if (e.key === 'ArrowRight') { moveSel(1); e.preventDefault(); return; }
  if (e.key === 'Tab') { e.preventDefault(); return; }
  if (e.key.length === 1 && !e.metaKey && !e.ctrlKey && document.activeElement !== kb) {
    handleChar(e.key);
    e.preventDefault();
    kb.focus({ preventScroll: true });
  }
});
wrap.addEventListener('pointerdown', e => {
  ensureAudio();
  const card = e.target.closest && e.target.closest('.card');
  if (state === 'select' && card) {
    const i = +card.dataset.i;
    if (i === sel) onEnter(); else { sel = i; SFX.select(); renderScreen(); }
  } else if (!['fight', 'finish', 'intro', 'ko', 'matchend', 'select'].includes(state)) onEnter();
  e.preventDefault();
  kb.focus({ preventScroll: true });
});
$('homeBtn').addEventListener('click', () => { window.location.href = 'https://reubenask.github.io/emerald-hills/platform.html'; });
const musicBtn = $('musicBtn'), sfxBtn = $('sfxBtn'), pauseBtn = $('pauseBtn');
musicBtn.addEventListener('click', () => {
  ensureAudio();
  musicOn = !musicOn; musicBtn.textContent = 'MUSIC: ' + (musicOn ? 'ON' : 'OFF');
  if (musicGain) musicGain.gain.value = musicOn && !paused ? 1 : 0;
  kb.focus({ preventScroll: true });
});
sfxBtn.addEventListener('click', () => {
  sfxOn = !sfxOn; sfxBtn.textContent = 'SFX: ' + (sfxOn ? 'ON' : 'OFF');
  if (!sfxOn && window.speechSynthesis) speechSynthesis.cancel();
  kb.focus({ preventScroll: true });
});
pauseBtn.addEventListener('click', () => { togglePause(); kb.focus({ preventScroll: true }); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !paused && ['intro', 'fight', 'finish'].includes(state)) togglePause();
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (!paused) update(dt);
  renderUI();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
makePortraits();
$('loading').remove();
goTitle();
kb.focus({ preventScroll: true });
requestAnimationFrame(frame);
</script>
</body>
</html>
