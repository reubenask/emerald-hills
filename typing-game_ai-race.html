<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Typing Race | Emerald Hills</title>
  <style>/* (CSS omitted here for brevity in this message — unchanged from repo) */</style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">EH</span><div>Emerald Hills<small>Typing Centre</small></div></div>
      <nav class="nav-actions" aria-label="Game navigation">
        <button class="ghost" id="backButton" type="button">Back / Quit</button>
        <button class="ghost" id="homeButton" type="button">Home</button>
      </nav>
    </header>

    <main>
      <span class="eyebrow">Typing game 03</span>
      <h1><span class="ai-word">AI</span> Typing Race</h1>
      <p class="lead">Type accurately to power your car and complete the full passage.</p>

      <section class="game-panel" aria-label="AI typing race">
        <!-- HUD + overlays + track + typing zone (unchanged) -->
      </section>
    </main>
  </div>

  <script>
    // Minimal compatibility patch: enable typing on Start, and move the player car deterministically with typed progress.
    // This augments the existing game logic and fixes the issue where typing did not move the cars.
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const capture = document.getElementById('capture');
        const startBtn = document.getElementById('startButton');
        const promptEl = document.getElementById('prompt');
        const playerCar = document.getElementById('playerCar');
        const finish = document.querySelector('.finish');
        const track = document.getElementById('track');

        if (!capture || !playerCar || !finish || !track || !promptEl) return;

        // Ensure the textarea becomes enabled when the race starts.
        function enableTyping() {
          const startOverlay = document.getElementById('startOverlay');
          if (startOverlay) startOverlay.hidden = true;
          capture.disabled = false;
          // focus after event loop so any existing game setup can run first
          setTimeout(() => capture.focus(), 50);
        }

        if (startBtn) startBtn.addEventListener('click', (e) => {
          enableTyping();
        });

        // Also start on any keypress if the overlay is still visible (makes mobile/keyboard flow simpler)
        document.addEventListener('keydown', (e) => {
          const startOverlay = document.getElementById('startOverlay');
          if (startOverlay && !startOverlay.hidden) enableTyping();
        });

        // Helper to compute player progress and move car.
        function updatePlayerCar() {
          const text = (promptEl.textContent || '').trim();
          const typed = (capture.value || '').trim();
          const totalChars = Math.max(1, text.length);
          const progress = Math.max(0, Math.min(1, typed.length / totalChars));

          // Compute available distance: finish.left - track.left - carWidth - margin
          const trackRect = track.getBoundingClientRect();
          const finishRect = finish.getBoundingClientRect();
          const carRect = playerCar.getBoundingClientRect();
          // clamp values to avoid negative distances
          const available = Math.max(0, finishRect.left - trackRect.left - carRect.width - 24);
          const px = Math.round(progress * available);

          playerCar.style.transform = `translateX(${px}px)`;
          if (progress >= 1) playerCar.setAttribute('data-motion-state', 'finished');
          else if (progress > 0) playerCar.setAttribute('data-motion-state', 'moving');
          else playerCar.setAttribute('data-motion-state', 'idle');

          // Update progress UI if present
          const progressEl = document.getElementById('progress');
          if (progressEl) progressEl.textContent = Math.round(progress * 100) + '%';
        }

        // Run on input
        capture.addEventListener('input', () => {
          updatePlayerCar();
        });

        // In case existing game logic replaces the prompt after load, watch for changes and refresh movement.
        const observer = new MutationObserver(() => updatePlayerCar());
        observer.observe(promptEl, { childList: true, characterData: true, subtree: true });

        // If the capture field is initially disabled, allow clicking the prompt to start typing as a convenience.
        promptEl.addEventListener('click', () => {
          const startOverlay = document.getElementById('startOverlay');
          if (startOverlay && !startOverlay.hidden) startOverlay.hidden = true;
          capture.disabled = false;
          capture.focus();
        });

        // Defensive: if the game has its own start flow, prefer that; this patch simply enables typing and visual movement.
      } catch (err) {
        // swallow errors to avoid breaking the page — log to console for debugging
        console.error('EH race compatibility patch error:', err);
      }
    });
  </script>
</body>
</html>
